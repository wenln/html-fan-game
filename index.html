<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Random Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky top bar with team slots; one main stage that swaps screens (title → draft → builder → team). */
:root{
  --bg:#eaeef5; --surface:#ffffff; --surface-2:#f4f6fa; --ink:#18202f; --muted:#5b6580;
  --line:#d3d9e4; --accent:#d8343b; --accent-ink:#ffffff; --focus:#2f6fe4;
  --up:#d8343b; --down:#2f6fe4; --good:#1f9d55; --warn:#c77700;
  --display:"Oxanium","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sky:#dde8f6; --turf:#dcebd2; --pad:#c3d4b8;
  --radius:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151f; --surface:#19202d; --surface-2:#141a26; --ink:#e6eaf2; --muted:#93a0b9;
  --line:#2b3446; --accent:#ff5b61; --accent-ink:#1a0d0e; --focus:#6c9cff; --up:#ff6b70; --down:#6c9cff; --good:#3ccf7d; --warn:#f0a83a;
  --sky:#172238; --turf:#18291f; --pad:#26392c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#19202d; --surface-2:#141a26; --ink:#e6eaf2; --muted:#93a0b9;
  --line:#2b3446; --accent:#ff5b61; --accent-ink:#1a0d0e; --focus:#6c9cff; --up:#ff6b70; --down:#6c9cff; --good:#3ccf7d; --warn:#f0a83a;
  --sky:#172238; --turf:#18291f; --pad:#26392c;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);min-height:100vh;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em;margin-right:auto;cursor:pointer;background:none;border:0;padding:0}
.ball{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--ink);position:relative;overflow:hidden;
  background:linear-gradient(var(--accent) 0 46%,var(--ink) 46% 54%,var(--surface) 54%)}
.ball::after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--surface);border:2px solid var(--ink);left:50%;top:50%;transform:translate(-50%,-50%)}
.slots{display:flex;gap:8px}


/* battle: animated sprites, effects, intro */
.fighter2.me .mon-art img.isback{transform:none}
.fighter2.me.fainted .mon-art img.isback{transform:translateY(30%) scale(.8)}
.mon-art.awaitball img{opacity:0;transform:scale(.2)!important}
.floattxt.hitn{top:auto;bottom:6%;font-size:13px;padding:2px 10px;background:var(--ink);color:var(--surface);border-color:transparent;animation-duration:.9s}
.fxlayer{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.proj{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,var(--c2) 30%,var(--c) 60%,transparent 72%);box-shadow:0 0 18px 6px color-mix(in srgb,var(--c) 70%,transparent)}
.impact{position:absolute;width:0;height:0;transform:scale(var(--s,1))}
.impact .pt{position:absolute;left:0;top:0;animation:ptburst .8s ease-out both;animation-delay:var(--d,0ms)}
.pt.flame{width:16px;height:22px;margin:-11px -8px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff8 0 15%,var(--c2) 30%,var(--c) 70%);filter:blur(.4px)}
.pt.drop{width:10px;height:14px;margin:-7px -5px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:linear-gradient(var(--c2),var(--c))}
.pt.leaf{width:16px;height:8px;margin:-4px -8px;border-radius:100% 0;background:linear-gradient(90deg,var(--c),var(--c2))}
.pt.shard{width:10px;height:18px;margin:-9px -5px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(var(--c2),var(--c))}
.pt.bubble{width:14px;height:14px;margin:-7px;border-radius:50%;border:2.5px solid var(--c);background:color-mix(in srgb,var(--c2) 40%,transparent)}
.pt.rock{width:16px;height:14px;margin:-7px -8px;clip-path:polygon(20% 0,80% 10%,100% 60%,70% 100%,10% 90%,0 35%);background:linear-gradient(var(--c),var(--c2))}
.pt.streak{width:60px;height:3px;margin:-1px -30px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c),transparent)}
.pt.dot{width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c2)}
.pt.wisp{width:20px;height:20px;margin:-10px;border-radius:50%;background:radial-gradient(circle,var(--c) 0 40%,transparent 70%);filter:blur(2px)}
.pt.sparkle{width:14px;height:14px;margin:-7px;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);background:var(--c2);filter:drop-shadow(0 0 3px var(--c))}
.m-burst .pt{animation-name:ptburst}
.m-rise .pt{animation-name:ptrise}
.m-up .pt{animation-name:ptup}
.m-fall .pt{animation-name:ptfall}
.m-swirl .pt{animation-name:ptswirl}
.m-sweep .pt{animation-name:ptsweep}
.m-swarm .pt{animation-name:ptswarm}
@keyframes ptburst{0%{transform:translate(0,0) rotate(var(--r,0deg)) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r,0deg)) scale(var(--k,1));opacity:0}}
@keyframes ptrise{0%{transform:translate(var(--x),30px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translate(calc(var(--x) * .6),-80px) scale(var(--k,1));opacity:0}}
@keyframes ptup{0%{transform:translate(var(--x),50px) rotate(var(--r)) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(var(--x),-50px) rotate(calc(var(--r) + 90deg));opacity:0}}
@keyframes ptfall{0%{transform:translate(var(--x),-140px) rotate(var(--r));opacity:0}20%{opacity:1}85%{transform:translate(var(--x),10px) rotate(calc(var(--r) + 120deg));opacity:1}100%{opacity:0}}
@keyframes ptswirl{0%{transform:rotate(var(--r)) translateX(10px) rotate(0) scale(.5);opacity:0}30%{opacity:1}100%{transform:rotate(calc(var(--r) + 260deg)) translateX(70px) rotate(200deg);opacity:0}}
@keyframes ptsweep{0%{transform:translate(-90px,var(--dy)) ;opacity:0}30%{opacity:1}100%{transform:translate(90px,calc(var(--dy) * .5));opacity:0}}
@keyframes ptswarm{0%{transform:translate(0,0) scale(.4);opacity:0}30%{transform:translate(calc(var(--dx) * .4),calc(var(--dy) * -.3));opacity:1}60%{transform:translate(calc(var(--dx) * -.3),calc(var(--dy) * .5))}100%{transform:translate(var(--dx),var(--dy)) scale(.6);opacity:0}}
.pt.bolt{width:60px;height:190px;margin:-130px 0 0 -30px;transform:translateX(var(--x));animation:boltfx .5s steps(2) both!important;animation-delay:var(--d)!important;filter:drop-shadow(0 0 6px var(--c))}
@keyframes boltfx{0%{opacity:0}10%,60%{opacity:1}100%{opacity:0}}
.pt.ring{width:30px;height:30px;margin:-15px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 12px var(--c2),inset 0 0 10px var(--c2);animation:ringfx .75s ease-out both!important;animation-delay:var(--d)!important}
@keyframes ringfx{0%{transform:scale(.3);opacity:1}100%{transform:scale(4.2);opacity:0}}
.pt.slash{width:150px;height:6px;margin:-3px -75px;border-radius:6px;background:linear-gradient(90deg,transparent,var(--c2),var(--c),transparent);transform:rotate(var(--r)) scaleX(0);animation:slashfx .45s ease-out both!important;animation-delay:var(--d)!important}
@keyframes slashfx{0%{transform:rotate(var(--r)) scaleX(0);opacity:1}60%{transform:rotate(var(--r)) scaleX(1);opacity:1}100%{transform:rotate(var(--r)) scaleX(1.1);opacity:0}}
.pt.bigstar{width:90px;height:90px;margin:-45px;clip-path:polygon(50% 0,62% 32%,98% 20%,72% 48%,100% 70%,64% 68%,55% 100%,42% 70%,6% 82%,30% 52%,0 26%,38% 32%);background:radial-gradient(circle,#fff 0 25%,var(--c2) 45%,var(--c) 80%);animation:starfx .45s ease-out both!important}
@keyframes starfx{0%{transform:scale(.2) rotate(-20deg);opacity:1}70%{transform:scale(1.1) rotate(5deg);opacity:1}100%{transform:scale(1.3);opacity:0}}
.arena2.shake{animation:shake .45s ease}
.arena2.shake-hard{animation:shake .5s ease 2}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.arena2.darkfx::after{content:"";position:absolute;inset:0;z-index:5;background:#10061e;animation:darkfx .7s ease both;pointer-events:none}
@keyframes darkfx{0%,100%{opacity:0}35%{opacity:.55}}
.arena2.flashfx::after{content:"";position:absolute;inset:0;z-index:5;background:#fffbe0;animation:flashfx .3s ease both;pointer-events:none}
@keyframes flashfx{0%,100%{opacity:0}30%{opacity:.6}}
.pball{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0 16%,#222 16% 24%,transparent 24%),linear-gradient(#e3343b 0 46%,#222 46% 54%,#f5f5f5 54%);box-shadow:0 3px 6px rgba(0,0,0,.35)}
.pball.open{animation:ballopen .35s ease forwards}
@keyframes ballopen{to{opacity:0;transform:var(--t,none) scale(1.6)}}
.popflash{position:absolute;width:20px;height:20px;margin:-10px;border-radius:50%;background:#fff;box-shadow:0 0 40px 24px #fff;animation:popflash .45s ease-out forwards}
@keyframes popflash{0%{transform:scale(.3);opacity:1}100%{transform:scale(4);opacity:0}}
.vsintro{position:absolute;inset:0;z-index:9;display:grid;grid-template-rows:1fr auto 1fr;pointer-events:none;overflow:hidden}
.vs-half{display:flex;align-items:center;gap:14px;padding:0 6%;color:#fff;font-family:var(--display)}
.vs-half b{display:block;font-size:clamp(20px,3.4vw,34px);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.vs-half.foe{background:linear-gradient(100deg,var(--gc,#2b3446) 0 70%,transparent 70.2%);animation:vsl .5s cubic-bezier(.2,.8,.3,1) both}
.vs-half.me{justify-content:flex-end;text-align:right;background:linear-gradient(-80deg,#d8343b 0 70%,transparent 70.2%);animation:vsr .5s cubic-bezier(.2,.8,.3,1) both}
.vs-av{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.3);flex:none}
.vs-quote{display:block;font-family:inherit;font-size:13px;font-weight:600;opacity:.92;font-style:italic;max-width:46ch}
.vs-mid{justify-self:center;font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,72px);color:#ffd84a;text-shadow:0 4px 0 #b3261e,0 0 30px rgba(255,216,74,.7);animation:vsmid .55s .25s cubic-bezier(.2,1.6,.4,1) both}
.vs-balls{display:flex;gap:5px;margin-top:6px}
.vs-half.me .vs-balls{justify-content:flex-end}
.vs-balls i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#222 18% 28%,transparent 28%),linear-gradient(#e3343b 0 45%,#222 45% 55%,#f5f5f5 55%)}
.vsintro.out .vs-half.foe{animation:vslout .5s ease forwards}.vsintro.out .vs-half.me{animation:vsrout .5s ease forwards}.vsintro.out .vs-mid{animation:fadeout .3s ease forwards}
@keyframes vsl{from{transform:translateX(-100%)}}@keyframes vsr{from{transform:translateX(100%)}}
@keyframes vslout{to{transform:translateX(-110%)}}@keyframes vsrout{to{transform:translateX(110%)}}
@keyframes vsmid{from{transform:scale(3) rotate(-12deg);opacity:0}}
@keyframes fadeout{to{opacity:0}}
/* dialogue styles */
.dialog{transition:border-color .2s,box-shadow .2s}
.dialog.dl-good{border-color:#5ee08a;box-shadow:0 0 0 3px rgba(94,224,138,.35),0 8px 24px -10px rgba(0,0,0,.6)}
.dialog.dl-good #dialog-text{color:#c9ffd9}
.dialog.dl-meh #dialog-text{color:#c9d2e3}
.dialog.dl-none #dialog-text{color:#aeb7c8;font-style:italic}
.dialog.dl-crit{border-color:#ffd84a;box-shadow:0 0 0 3px rgba(255,216,74,.4),0 8px 24px -10px rgba(0,0,0,.6)}
.dialog.dl-crit #dialog-text{color:#ffe68a}
.dialog.dl-faint #dialog-text{color:#ffb3b5}
.dialog.dl-up #dialog-text{color:#ffcfa6}.dialog.dl-down #dialog-text{color:#b8d1ff}
.dialog.dl-win{border-color:#ffd84a}
.dialog{cursor:pointer}
.blog p.lg-good{color:var(--good);font-weight:600}.blog p.lg-crit{color:var(--warn);font-weight:700}.blog p.lg-faint{color:var(--up);font-weight:600}.blog p.lg-none,.blog p.lg-meh{color:var(--muted)}
/* emotes and summary */
.emotes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.emote{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.emote:hover{border-color:var(--accent)}
.emote-bubble{position:absolute;z-index:9;transform:translate(-50%,-100%);background:#fff;color:#18202f;font-weight:800;font-size:15px;border-radius:14px;padding:7px 12px;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);animation:bubble 2.4s ease forwards;white-space:nowrap;pointer-events:none}
.emote-bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes bubble{0%{opacity:0;transform:translate(-50%,-80%) scale(.6)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.05)}20%{transform:translate(-50%,-100%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}
.summary{margin-top:12px;display:grid;gap:10px}
.sum-mvp{display:flex;gap:14px;align-items:center;border-radius:14px;padding:10px 14px;background:linear-gradient(100deg,#fff4c2,#ffe28a);color:#3a2a00;border:1.5px solid #e6b422}
.sum-mvp b{display:block;font-family:var(--display);font-size:20px}
.sum-mvp .note{color:#6b5410}
.sum-mvpart img{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2))}
.sum-list{display:grid;gap:6px}
.sum-row{display:grid;grid-template-columns:36px minmax(0,1fr) repeat(3,auto);gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--surface-2)}
.sum-row.mvp{border-color:#e6b422}
.sum-row.out{opacity:.65}
.sum-row b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sum-art img{width:36px;height:36px;object-fit:contain}
.sum-n{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:baseline}
.sum-n b{color:var(--ink);font-size:14px}
.sum-foot{margin:0}
@media (max-width:640px){ .sum-row{grid-template-columns:32px minmax(0,1fr) auto auto} .sum-row .sum-n:nth-of-type(3){display:none} .vs-av{width:44px;height:44px;font-size:22px} }

/* styled pickers */
.movepick > span[aria-hidden="true"]{font-size:0;flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px)}
.cp-native{position:absolute!important;opacity:0!important;pointer-events:none!important;width:1px!important;height:1px!important;overflow:hidden}
.cpick{width:100%;min-height:42px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;transition:border-color .15s,box-shadow .15s}
.cpick:hover{border-color:var(--accent)}
.cpick[aria-expanded=true]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.cpick:disabled{opacity:.55;cursor:default}
.cp-val{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.cp-val span{overflow:hidden;text-overflow:ellipsis}
.cp-tname{font-weight:600}
.cp-caret{flex:none;width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.cpick[aria-expanded=true] .cp-caret{transform:rotate(-135deg) translate(-2px,-2px)}
.sheet-controls .cpick,.namefield .cpick{width:auto;min-width:170px}
.cpop{position:fixed;z-index:60;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 22px 50px -20px rgba(0,0,0,.5);display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;animation:cpin .14s ease}
.cpop[hidden]{display:none}
@keyframes cpin{from{opacity:0;transform:translateY(-4px)}}
.cp-head{display:none;justify-content:space-between;align-items:center;padding:12px 16px 8px}
.cp-list{overflow-y:auto;overscroll-behavior:contain;padding:6px;display:grid;gap:2px;scrollbar-width:thin}
.cp-opt{display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;text-align:left;border:1.5px solid transparent;background:none;color:inherit;font:inherit;border-radius:9px;padding:8px 10px;cursor:pointer}
.cp-opt b{font-weight:600}
.cp-opt:hover,.cp-opt:focus-visible{background:var(--surface-2);outline:none;border-color:var(--line)}
.cp-opt.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cp-opt.on::after{content:"";flex:none;width:6px;height:11px;border-right:2.5px solid var(--accent);border-bottom:2.5px solid var(--accent);transform:rotate(45deg);margin:0 3px 3px auto}
.cp-opt[disabled]{opacity:.45;cursor:default}
.cp-note{color:var(--muted);font-size:11.5px;font-weight:600;margin-left:auto}
.cp-opt.on .cp-note{margin-left:auto}
.cp-nat{display:flex;gap:4px;margin-left:auto}
.cp-nat i{font-style:normal;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.cp-nat i.up{color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.cp-nat i.down{color:var(--up);background:color-mix(in srgb,var(--up) 12%,transparent)}
.cpick .cp-nat{margin-left:6px}
.cp-all{font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;border:1.5px dashed var(--line);border-radius:6px;padding:2px 8px;color:var(--muted)}
.cpop.k-type .cp-list{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:10px}
.cpop.k-type .cp-opt{flex-direction:column;justify-content:center;gap:3px;padding:9px 6px;border-color:var(--line);background:var(--surface-2)}
.cpop.k-type .cp-opt .type{font-size:12px;padding:4px 10px;width:100%;text-align:center}
.cpop.k-type .cp-opt .cp-note{margin:0;font-size:10.5px}
.cpop.k-type .cp-opt.on{box-shadow:0 0 0 2px var(--accent);border-color:transparent}
.cpop.k-type .cp-opt.on::after{display:none}
.cpop.k-type .cp-opt:hover{transform:translateY(-1px)}
.cpop.k-nature .cp-list{grid-template-columns:repeat(2,minmax(0,1fr))}
.cpop.sheetmode{left:0!important;right:0;bottom:0;top:auto!important;width:auto!important;max-height:72vh!important;border-radius:18px 18px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);animation:cpsheet .2s ease}
.cpop.sheetmode .cp-head{display:flex}
.cpop.sheetmode .cp-opt{padding:12px}
.cpop.sheetmode.k-type .cp-list{grid-template-columns:repeat(3,minmax(0,1fr))}
.cpop.sheetmode.k-nature .cp-list{grid-template-columns:minmax(0,1fr)}
@keyframes cpsheet{from{transform:translateY(40px);opacity:0}}

/* gym challenge */
.tag.gymtag{background:#d4a017;color:#2b1d00}
.gym-hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;background:linear-gradient(120deg,color-mix(in srgb,#d4a017 12%,var(--surface)),var(--surface) 55%)}
.gym-hero h3{font-size:20px}
.gym-diff{display:grid;gap:6px;justify-items:end}
.gym-progress{height:10px;border-radius:999px;background:var(--surface-2);border:1.5px solid var(--line);overflow:hidden;margin:12px 0 4px}
.gym-progress span{display:block;height:100%;background:linear-gradient(90deg,#f5c84b,#d8343b);border-radius:999px;transition:width .4s}
.gymlist{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px;counter-reset:g}
.gym{--gc:#888;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--surface);position:relative;overflow:hidden}
.gym::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gc)}
.gym.next{border-color:var(--gc);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 22%,transparent)}
.gym.beaten{background:linear-gradient(100deg,color-mix(in srgb,var(--gc) 9%,var(--surface)),var(--surface) 60%)}
.gym.locked{opacity:.55}
.gym-av{width:52px;height:52px;border-radius:14px;background:var(--gc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.gym.locked .gym-av{filter:grayscale(1)}
.gym-info{display:grid;gap:3px;min-width:0}
.gym-info b{font-family:var(--display);font-size:18px}
.gym-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gym-meta .type{font-size:10px;padding:2px 7px}
.gym-quote{font-size:13px;color:var(--muted);font-style:italic}
.gym-side{display:flex;align-items:center;gap:10px}
.gym-crown{font-size:28px;color:#d4a017}
.gym-sep{list-style:none;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin:8px 0 0}
.gym-sep::before,.gym-sep::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.award{position:absolute;inset:0;z-index:12;display:grid;place-items:center;background:rgba(10,14,24,.55);animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}}
.award-card{display:grid;justify-items:center;gap:8px;text-align:center;background:var(--surface);color:var(--ink);border-radius:20px;padding:22px 26px;max-width:min(420px,90%);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);animation:awardin .6s cubic-bezier(.2,1.4,.4,1) both}
.award-card b{font-family:var(--display);font-size:22px}
@keyframes awardin{from{transform:scale(.6) translateY(20px);opacity:0}}
.award-badge svg{animation:badgespin 1.2s cubic-bezier(.2,.8,.3,1) both;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3))}
@keyframes badgespin{from{transform:rotateY(540deg) scale(.4)}}
.award-crown{font-size:70px;color:#d4a017;line-height:1}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-12px;left:var(--x);width:9px;height:14px;background:var(--c);border-radius:2px;animation:confetti 2.6s linear both;animation-delay:var(--d)}
@keyframes confetti{to{transform:translateY(560px) rotate(720deg)}}
@media (max-width:760px){ .gym-hero{grid-template-columns:minmax(0,1fr)} .gym-diff{justify-items:start} .gym{grid-template-columns:44px minmax(0,1fr)} .gym-av{width:44px;height:44px;font-size:20px} .gym-side{grid-column:1 / -1;justify-content:space-between} }

/* status/field move animations */
.pt.glyph{width:auto;height:auto;margin:-12px -8px;font-size:22px;font-weight:800;color:var(--c);text-shadow:0 0 6px var(--c2),0 2px 0 rgba(0,0,0,.25);line-height:1}
.bubblefx{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid rgba(140,225,255,.95);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.55),rgba(120,220,255,.18) 45%,rgba(120,220,255,.35) 70%);box-shadow:0 0 24px rgba(120,220,255,.7);animation:bubblefx .9s ease both}
@keyframes bubblefx{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.05);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.1);opacity:0}}
.wallfx{position:absolute;border-radius:14px;border:3px solid var(--c);background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%) -150% 0/250% 100% no-repeat,color-mix(in srgb,var(--c) 28%,transparent);box-shadow:0 0 22px var(--c);animation:wallfx 1.3s ease both}
.wallfx.rainbow{--c:#9fd0ff;border-image:linear-gradient(90deg,#ff7a7a,#ffd84a,#5ee08a,#6c9cff,#c06bff) 1;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.6) 45%,transparent 60%) -150% 0/250% 100% no-repeat,linear-gradient(90deg,#ff7a7a40,#ffd84a40,#5ee08a40,#6c9cff40,#c06bff40)}
@keyframes wallfx{0%{transform:scaleY(0);opacity:0}25%{transform:scaleY(1);opacity:1;background-position:-150% 0,0 0}70%{opacity:1;background-position:150% 0,0 0}100%{opacity:0;background-position:150% 0,0 0}}
.windfx{position:absolute;left:0;width:120px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);animation:windfx .9s ease-in both}
.windfx.foe{animation-name:windfxr}
@keyframes windfx{from{transform:translateX(-140px);opacity:0}30%{opacity:1}to{transform:translateX(900px);opacity:0}}
@keyframes windfxr{from{transform:translateX(900px);opacity:0}30%{opacity:1}to{transform:translateX(-140px);opacity:0}}
.roomwarp{position:absolute;inset:-20%;background:repeating-linear-gradient(45deg,rgba(255,120,200,.35) 0 3px,transparent 3px 34px),repeating-linear-gradient(-45deg,rgba(255,120,200,.35) 0 3px,transparent 3px 34px);animation:roomwarp 1.4s ease both}
.roomwarp.magic-room{filter:hue-rotate(60deg)}.roomwarp.wonder-room{filter:hue-rotate(160deg)}.roomwarp.gravity{background:repeating-linear-gradient(180deg,rgba(40,30,80,.4) 0 3px,transparent 3px 26px)}
@keyframes roomwarp{0%{opacity:0;transform:scale(1.6) rotate(-10deg)}35%{opacity:1}100%{opacity:0;transform:scale(1) rotate(8deg)}}
.thrown{position:absolute;left:0;top:0}
.thrown.rockfx{width:18px;height:16px;margin:-8px -9px;clip-path:polygon(20% 0,80% 10%,100% 60%,70% 100%,10% 90%,0 35%);background:linear-gradient(#c8b07a,#7d6a42)}
.thrown.spikefx{width:0;height:0;margin:-10px -8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:18px solid var(--c,#8a8f99)}
.thrown.webball{width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(circle,#fff 0 30%,#ddd 60%);box-shadow:0 0 6px #fff}
.webfx{position:absolute;animation:webfx .9s ease both;filter:drop-shadow(0 0 3px rgba(255,255,255,.7))}
.webfx.small{animation-duration:.9s}
@keyframes webfx{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.05);opacity:1}80%{opacity:1}100%{opacity:0}}
.groundwave{position:absolute;width:40px;height:14px;margin:-7px -20px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 16px var(--c);animation:groundwave 1.1s ease-out both}
@keyframes groundwave{0%{transform:scale(.5);opacity:1}100%{transform:scale(18,7);opacity:0}}
.hazefx{position:absolute;inset:0;background:radial-gradient(circle at 30% 60%,rgba(255,255,255,.7),transparent 50%),radial-gradient(circle at 70% 40%,rgba(230,236,244,.75),transparent 55%);animation:hazefx 1.3s ease both}
@keyframes hazefx{0%,100%{opacity:0}40%,60%{opacity:1}}
.ringproj{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px;border-radius:50%;border:3px solid var(--c);box-shadow:0 0 10px var(--c)}
.fighter2.eyesfx .mon-art img{animation:eyesfx .7s ease}
@keyframes eyesfx{30%{filter:brightness(1.6) drop-shadow(0 0 10px #ff4d4d)}}
/* persistent field art */
.fieldart{position:absolute;z-index:4;pointer-events:none}
.fieldart.foe{right:3%;top:5%;width:50%;height:44%}
.fieldart.me{left:2%;bottom:20%;width:54%;height:52%}
.arena2[data-fmt=doubles] .fieldart.foe{width:56%;height:40%}
.fa-wall{position:absolute;inset:2% 1%;border-radius:16px;border:2px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);box-shadow:inset 0 0 18px color-mix(in srgb,var(--c) 35%,transparent);animation:fawall 3s ease-in-out infinite}
.fa-wall.rainbow{border-color:rgba(160,210,255,.7);background:linear-gradient(90deg,#ff7a7a18,#ffd84a18,#5ee08a18,#6c9cff18,#c06bff18);inset:10% 7%}
@keyframes fawall{50%{box-shadow:inset 0 0 28px color-mix(in srgb,var(--c,#9fd0ff) 50%,transparent)}}
.fa-dome{position:absolute;left:8%;right:8%;bottom:4%;height:80%;border-radius:50% 50% 12% 12%/70% 70% 12% 12%;border:2px solid rgba(180,140,255,.55);background:radial-gradient(ellipse at 50% 100%,rgba(180,140,255,.18),transparent 70%)}
.fa-mist{position:absolute;inset:30% 0 0;background:radial-gradient(ellipse at 50% 100%,rgba(230,242,255,.55),transparent 70%);filter:blur(4px)}
.fa-wind{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,255,255,.35) 60px 62px,transparent 62px 140px);mask:linear-gradient(transparent 10%,#000 30% 70%,transparent 90%);animation:fawind 1.2s linear infinite;opacity:.6}
.fieldart.foe .fa-wind{animation-direction:reverse}
@keyframes fawind{to{background-position:140px 0}}
.fa-ground{position:absolute;left:0;right:0;bottom:0;height:26%}
.fa-rock{position:absolute;bottom:40%;width:15px;height:13px;clip-path:polygon(20% 0,80% 10%,100% 60%,70% 100%,10% 90%,0 35%);background:linear-gradient(#cdb683,#7d6a42);animation:farock 2.4s ease-in-out infinite}
@keyframes farock{50%{transform:translateY(-8px) rotate(12deg)}}
.fa-spike{position:absolute;bottom:8%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:13px solid var(--c)}
.fa-web{position:absolute;inset:-30% 2% 0;opacity:.7}
.arena2[data-room=trick]::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(45deg,rgba(255,120,200,.12) 0 2px,transparent 2px 40px),repeating-linear-gradient(-45deg,rgba(255,120,200,.12) 0 2px,transparent 2px 40px)}
.arena2[data-grav="1"] .bd-sky{filter:brightness(.8) saturate(.8)}
/* both sides' sprites are the same size */
.fighter2.foe,.fighter2.me{width:min(27%,200px)}
.arena2[data-fmt=doubles] .fighter2.foe,.arena2[data-fmt=doubles] .fighter2.me{width:min(22%,170px)}
.fighter2 .mon-art img{width:92%;height:92%;object-fit:contain;object-position:50% 100%}
@media (max-width:860px){ .fighter2.foe,.fighter2.me{width:34%} .arena2[data-fmt=doubles] .fighter2.foe,.arena2[data-fmt=doubles] .fighter2.me{width:29%} }
/* sound popover */
.soundpop{position:fixed;z-index:35;top:64px;right:max(16px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 32px));background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);display:grid;gap:8px}
.soundpop[hidden]{display:none}
.sp-head{display:flex;justify-content:space-between;align-items:center}
.sp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.sp-row span{display:grid}
.sp-row small{color:var(--muted);font-size:12px}
.sp-vol{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.sp-vol input{accent-color:var(--accent)}
.switch{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.switch:checked{background:var(--accent)}
.switch:checked::after{transform:translateX(18px)}
.switch:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* header buttons */
.barbtns{display:flex;gap:6px;align-items:center}
.iconbtn2{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;transition:border-color .15s,transform .1s}
.iconbtn2:hover{border-color:var(--accent)}
.iconbtn2:active{transform:scale(.95)}
.iconbtn2.off{color:var(--muted)}
/* difficulty picker */
.diffseg{display:inline-flex;flex-wrap:wrap;gap:0;border:1.5px solid var(--line);border-radius:999px;padding:3px;background:var(--surface-2)}
.diffseg label{position:relative;cursor:pointer}
.diffseg input{position:absolute;opacity:0;pointer-events:none}
.diffseg span{display:block;padding:6px 13px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);transition:background .15s,color .15s}
.diffseg input:checked+span{color:#fff;background:var(--dc,var(--accent))}
.diffseg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:1px}
.diffseg .diff-easy{--dc:#29a97b}.diffseg .diff-normal{--dc:#2f6fe4}.diffseg .diff-hard{--dc:#e07b1a}.diffseg .diff-expert{--dc:#c0262d}
/* draft reveals */
.card.reveal{animation:cardin .7s cubic-bezier(.2,.8,.3,1.1) both;animation-delay:var(--rd,0ms)}
@keyframes cardin{0%{opacity:0;transform:perspective(900px) rotateY(85deg) scale(.92)}60%{opacity:1}100%{opacity:1;transform:none}}
.card{position:relative}
.cardback{position:absolute;inset:0;z-index:4;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at 50% 50%,#fff 0 9%,#222 9% 12%,transparent 12%),linear-gradient(#d8343b 0 48%,#222 48% 52%,#f4f6fa 52%);animation:cardback .7s ease both;animation-delay:var(--rd,0ms)}
@keyframes cardback{0%,35%{opacity:1}55%,100%{opacity:0}}
.card.rare{border-color:#e6b422;box-shadow:0 0 0 2px #e6b42255,0 10px 30px -10px #e6b422aa}
.card.rare.reveal{animation:cardin .7s cubic-bezier(.2,.8,.3,1.1) both,raregl 2.4s ease-in-out .7s infinite;animation-delay:var(--rd,0ms),calc(var(--rd,0ms) + .7s)}
.card.rare:not(.reveal){animation:raregl 2.4s ease-in-out infinite}
@keyframes raregl{50%{box-shadow:0 0 0 3px #e6b42288,0 0 34px -4px #f5c84bcc}}
.card.rare.mythical{border-color:#c06bff;box-shadow:0 0 0 2px #c06bff55,0 10px 30px -10px #c06bffaa}
.badge.rarity{background:linear-gradient(90deg,#f5c84b,#e6a019);color:#3a2600;border-color:transparent}
.card.mythical .badge.rarity{background:linear-gradient(90deg,#d79bff,#9b4dff);color:#fff}
.badge.shiny{background:linear-gradient(90deg,#fff3b0,#ffd166);color:#5a4300;border-color:#e6c229}
.sparkles{position:absolute;inset:0;pointer-events:none}
.art{position:relative}
.sparkles i{position:absolute;width:14px;height:14px;background:#ffe27a;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);animation:twinkle 1.6s ease-in-out infinite}
.sparkles i:nth-child(1){left:14%;top:18%}.sparkles i:nth-child(2){right:16%;top:28%;animation-delay:.4s;width:10px;height:10px}.sparkles i:nth-child(3){left:24%;bottom:20%;animation-delay:.8s;width:9px;height:9px}.sparkles i:nth-child(4){right:22%;bottom:14%;animation-delay:1.2s}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
/* trainer card */
.tcard{--av:#d8343b;max-width:860px;margin:0 auto;border-radius:22px;padding:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--av) 18%,var(--surface)),var(--surface) 55%);border:2px solid color-mix(in srgb,var(--av) 45%,var(--line));box-shadow:0 20px 50px -28px color-mix(in srgb,var(--av) 70%,#000);display:grid;gap:18px}
.tc-head{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.12em;font-size:12px}
.tc-logo{display:flex;gap:8px;align-items:center;font-family:var(--display)}
.tc-main{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
.tc-avatar{width:84px;height:84px;border-radius:22px;border:0;background:var(--av);color:#fff;font-family:var(--display);font-size:38px;font-weight:800;cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.tc-avatar:hover{filter:brightness(1.08)}
.tc-fav{display:grid;justify-items:center;text-align:center;gap:2px;min-width:120px}
.tc-favart img{width:84px;height:84px;object-fit:contain}
.tc-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tc-stat{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:2px}
.tc-stat b{font-size:22px}
.tc-stat span{font-size:12px;color:var(--muted);font-weight:600}
.tc-split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.tc-badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tc-badge{display:grid;place-items:center;opacity:.55}.tc-badge.got{opacity:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
.tc-rare{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.tc-rareart img{width:56px;height:56px;object-fit:contain}
.tc-modes{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:760px){ .tc-main{grid-template-columns:auto minmax(0,1fr)} .tc-fav{grid-column:1 / -1;grid-auto-flow:column;justify-content:start;align-items:center;gap:8px} .tc-favart img{width:56px;height:56px} .tc-stats{grid-template-columns:repeat(2,minmax(0,1fr))} .tc-split{grid-template-columns:minmax(0,1fr)} .tcard{padding:16px} .barbtns{margin-left:auto} }

.slot{width:52px;height:52px;border-radius:12px;border:1.5px dashed var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0;cursor:pointer;position:relative}
.slot.filled{border-style:solid}
.slot.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.slot img{width:46px;height:46px;object-fit:contain}
.slot .n{font-family:var(--mono);font-size:12px;color:var(--muted)}

main{max-width:1180px;margin:0 auto;padding-block:28px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
footer{max-width:1180px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:12px}
footer a{color:inherit}

.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s,background .12s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:13px}

/* title */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:30px}
.hero h1{font-size:clamp(40px,7vw,78px);font-weight:800;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{max-width:52ch;color:var(--muted);font-size:17px}
.modes{display:grid;gap:12px}
.mode{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;text-align:left;padding:18px 20px;border-radius:var(--radius);border:1.5px solid var(--line);background:var(--surface);cursor:pointer}
.mode:hover{border-color:var(--accent)}
.mode .tag{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 10px}
.mode h3{font-size:22px}
.mode p{margin:2px 0 0;color:var(--muted);font-size:14px}
.rules{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:8px}
.rules li{display:flex;gap:10px;align-items:baseline;color:var(--muted)}
.rules b{color:var(--ink);font-family:var(--mono);font-size:13px;min-width:44px}

/* draft */
.stagehead{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.stagehead h2{font-size:clamp(26px,4vw,38px);font-weight:800}
.pips{display:flex;gap:6px;margin-top:10px}
.pip{width:34px;height:6px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.card{position:relative;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;min-width:0}
.card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 10px 28px -14px color-mix(in srgb,var(--ink) 40%,transparent)}
.card.mega{border-color:transparent;background:linear-gradient(var(--surface),var(--surface)) padding-box,conic-gradient(from 180deg,#ff5f8f,#ffc94a,#4ee0b5,#5aa8ff,#b77bff,#ff5f8f) border-box;border:2.5px solid transparent}
.card .dex{font-family:var(--mono);color:var(--muted);font-size:13px}
.art{aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-radius:12px;background:radial-gradient(circle at 50% 60%,var(--surface-2) 0 55%,transparent 56%)}
.art img{width:82%;height:82%;object-fit:contain;image-rendering:auto;filter:drop-shadow(0 6px 8px color-mix(in srgb,var(--ink) 18%,transparent))}
.card h3{font-size:24px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 8px;border:1.5px solid var(--line);color:var(--muted)}
.badge.mega{border:0;color:#fff;background:linear-gradient(90deg,#e0457b,#8a5cf6)}
.badge.evo{border-color:var(--good);color:var(--good)}
.types{display:flex;gap:6px;flex-wrap:wrap}
.type{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:3px 9px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.type.light{color:#1d1d1d;text-shadow:none}
.minibars{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:12px}
.minibars span:nth-child(3n+1){color:var(--muted);font-weight:600}
.minibars i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.minibars i b{display:block;height:100%;border-radius:3px}
.bst{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
.skeleton{cursor:default}
.skeleton:hover{transform:none;border-color:var(--line);box-shadow:none}
.shimmer{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}

/* builder */
.builder{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.side{position:sticky;top:90px;display:grid;gap:14px}
.side h2{font-size:30px;font-weight:800}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field input,.field select{width:100%;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
.field .hint{font-size:13px;color:var(--muted);min-height:1.3em}
.field .err{color:var(--up)}
.stats{display:grid;grid-template-columns:52px 1fr auto;gap:6px 10px;align-items:center}
.stats .k{font-size:12px;font-weight:700;color:var(--muted)}
.stats .k.up{color:var(--up)} .stats .k.down{color:var(--down)}
.stats .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.stats .track b{display:block;height:100%}
.stats .v{text-align:right;white-space:nowrap;font-family:var(--mono);font-weight:700}
.stats .base{font-size:11px;color:var(--muted);font-weight:500}
.spread{width:100%;border-collapse:collapse;font-size:14px}
.spread th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:700;padding:0 6px 8px}
.spread td{padding:5px 6px;border-top:1px solid var(--line);vertical-align:middle}
.spread input[type=number]{width:62px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 7px;font-family:var(--mono)}
.spread input[type=range]{width:100%;accent-color:var(--accent);min-width:80px}
.spread .tot{font-family:var(--mono);font-weight:700;text-align:right}
.scroll{overflow-x:auto}
.moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.move{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--surface-2);min-width:0}
.move input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px}
.move .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;min-height:22px}
.evo{display:grid;gap:8px}
.evo .btn{justify-content:space-between;width:100%}
.evo small{color:var(--muted);font-weight:500}
.note{font-size:13px;color:var(--muted)}
.itemrow{display:flex;gap:10px;align-items:center}
.itemrow img{width:30px;height:30px;object-fit:contain;image-rendering:pixelated}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

/* team */
.teamcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.teamcards .card{cursor:default}
.teamcards .card:hover{transform:none}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
textarea.export{width:100%;min-height:300px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;font-family:var(--mono);font-size:13px;line-height:1.55}

.error{border:1.5px solid var(--up);background:color-mix(in srgb,var(--up) 8%,var(--surface));border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;transition:.25s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}


[hidden]{display:none!important}
/* settings */
.setgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.setgrid fieldset{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:0;display:grid;gap:8px;align-content:start;background:var(--surface-2);min-width:0}
.setgrid legend{padding:0 4px}
.gens{display:flex;flex-wrap:wrap;gap:6px}
.genbtn{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--mono);font-weight:700;cursor:pointer}
.genbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#settings{margin-top:8px}
.mega-btn{border-color:#a77bf3}
.mega-btn span{background:linear-gradient(90deg,#d6447f,#7c55e8);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700}
.mega-btn.sm{color:#7c55e8}

.devo{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.devo .label{width:100%}
.formbtn.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));opacity:1}

/* battle info */
.bside{display:grid;gap:14px;min-width:0}
.fcards{display:grid;gap:10px}
.fcard{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--surface-2)}
.fcard.mine{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.fhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fname{font-family:var(--display);font-size:17px}
.ftypes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.statlist,.boostlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.statlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;font-size:13px}
.boostlist{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.boostlist li{display:flex;gap:6px;align-items:baseline;font-size:13px}
.boostlist li span:first-child{flex:1}
.up{color:var(--good)} .down{color:var(--up)}
.livestats{display:grid;grid-template-rows:auto auto;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);text-align:center;font-size:11px;gap:0 4px;border-top:1px solid var(--line);padding-top:8px}
.livestats span{color:var(--muted);font-weight:600}
.livestats b{font-size:14px}
.btabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:10px}
.btabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.btabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tsum{display:grid;gap:10px;max-height:640px;overflow-y:auto}
.trow{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.trow.active{border-color:var(--accent)}
.trow.out{opacity:.5}
.tart img{width:56px;height:56px;object-fit:contain}
.tinfo{display:grid;gap:6px;min-width:0}
.thead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thead b{font-family:var(--display);font-size:15px}
.pill{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--accent);color:var(--accent-ink)}
.tmoves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px 10px;font-size:12.5px}
.tmoves i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.match{display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px}
.mchip{border:1.5px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:700;font-size:11px}
.mchip.good{border-color:var(--good);color:var(--good)}
.mchip.bad{border-color:var(--up);color:var(--up)}
.trow .btn.sm{justify-self:start}


/* ===== battle screen v2 ===== */
.battle2{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
.bt-main{display:grid;gap:0;min-width:0}
.arena2{position:relative;height:clamp(300px,42vw,460px);border-radius:18px 18px 0 0;overflow:hidden;border:1.5px solid var(--line);border-bottom:0;isolation:isolate;color:#16202e}
.arena2+.bt-info+.controls,.arena2+.bt-info[hidden]+.controls{border-radius:0 0 18px 18px}
.bd-sky,.bd-far,.bd-ground,.wx{position:absolute;left:0;right:0;pointer-events:none}
.bd-sky{top:0;height:62%;z-index:0}
.bd-far{top:30%;height:30%;z-index:1}
.bd-ground{bottom:0;height:46%;z-index:1}
.wx{inset:0;z-index:6}
.terrain{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:2;pointer-events:none;opacity:0;transition:opacity .6s}
.terrain[data-te]:not([data-te=""]){opacity:1}
.terrain[data-te=electric]{background:repeating-linear-gradient(100deg,transparent 0 22px,rgba(255,236,80,.55) 22px 24px,transparent 24px 60px),linear-gradient(transparent,rgba(255,224,60,.35));animation:zap 1.1s steps(3) infinite}
.terrain[data-te=grassy]{background:radial-gradient(circle,rgba(80,190,70,.6) 0 3px,transparent 4px) 0 0/28px 18px,linear-gradient(transparent,rgba(70,170,60,.45))}
.terrain[data-te=misty]{background:radial-gradient(ellipse 40% 30% at 30% 70%,rgba(255,190,230,.55),transparent),radial-gradient(ellipse 40% 30% at 75% 60%,rgba(255,210,240,.5),transparent),linear-gradient(transparent,rgba(250,180,225,.35));animation:mist 4s ease-in-out infinite alternate}
.terrain[data-te=psychic]{background:repeating-radial-gradient(ellipse at 50% 100%,rgba(220,90,200,.28) 0 10px,transparent 10px 26px),linear-gradient(transparent,rgba(200,80,190,.35));animation:mist 3s ease-in-out infinite alternate}
@keyframes zap{50%{opacity:.6}}
@keyframes mist{to{transform:translateX(3%)}}
.ftag.te-electric{background:rgba(214,170,0,.92);color:#231b00}.ftag.te-grassy{background:rgba(60,150,60,.9)}.ftag.te-misty{background:rgba(214,100,170,.9)}.ftag.te-psychic{background:rgba(170,60,160,.9)}
.subdoll{position:absolute;left:50%;bottom:4%;width:58%;height:58%;transform:translateX(-50%) scale(.4);opacity:0;transition:transform .45s cubic-bezier(.2,.8,.3,1.3),opacity .3s;pointer-events:none;filter:drop-shadow(0 6px 5px rgba(0,0,0,.3))}
.fighter2.subbed .subdoll{opacity:1;transform:translateX(-50%) scale(1)}
.fighter2.subbed .mon-art img{opacity:.22}
.st.sub{background:#5b6880}
/* tall grass */
.arena2[data-bd=grass] .bd-sky{background:linear-gradient(#7cc3f5,#c7ecff 85%)}
.arena2[data-bd=grass] .bd-far{background:radial-gradient(ellipse 30% 70% at 15% 100%,#6fbf62 98%,transparent 100%),radial-gradient(ellipse 34% 80% at 62% 100%,#5eae55 98%,transparent 100%),radial-gradient(ellipse 26% 60% at 92% 100%,#79c96a 98%,transparent 100%)}
.arena2[data-bd=grass] .bd-ground{background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 40px,transparent 40px 80px),linear-gradient(#8fd36d,#62b04b)}
.arena2[data-bd=grass] .bd-ground::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(115deg,#3f8f37 0 6px,transparent 6px 14px),repeating-linear-gradient(65deg,#4da043 0 6px,transparent 6px 16px);opacity:.9;mask:linear-gradient(transparent,#000 40%)}
.arena2[data-bd=grass] .pad{background:radial-gradient(ellipse at 50% 45%,#b9e59a 0 52%,#7fbf5f 53% 70%,transparent 71%)}
/* gym */
.arena2[data-bd=gym] .bd-sky{background:repeating-linear-gradient(90deg,transparent 0 120px,rgba(255,255,255,.08) 120px 124px),linear-gradient(#3d4a73,#6b79a8);height:58%}
.arena2[data-bd=gym] .bd-far{top:12%;height:30%;background:linear-gradient(90deg,transparent 8%,#d8343b 8% 14%,transparent 14% 86%,#2f6fe4 86% 92%,transparent 92%);opacity:.9}
.arena2[data-bd=gym] .bd-ground{height:48%;background:radial-gradient(ellipse 22% 26% at 50% 55%,transparent 0 92%,rgba(255,255,255,.75) 93% 96%,transparent 97%),linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.7) 49.6% 50.4%,transparent 50.4%),repeating-linear-gradient(90deg,#d9b07a 0 46px,#cfa46c 46px 92px)}
.arena2[data-bd=gym] .pad{background:radial-gradient(ellipse at 50% 45%,#f4f1ea 0 50%,#c9c3b6 51% 68%,transparent 69%)}
/* cave */
.arena2[data-bd=cave] .bd-sky{height:70%;background:linear-gradient(#1d1714,#3e3029)}
.arena2[data-bd=cave] .bd-far{top:0;height:24%;background:conic-gradient(from 180deg at 10% 0,transparent 160deg,#2a211c 160deg 200deg,transparent 200deg),conic-gradient(from 180deg at 35% 0,transparent 165deg,#30261f 165deg 195deg,transparent 195deg),conic-gradient(from 180deg at 64% 0,transparent 162deg,#2a211c 162deg 198deg,transparent 198deg),conic-gradient(from 180deg at 88% 0,transparent 166deg,#30261f 166deg 194deg,transparent 194deg)}
.arena2[data-bd=cave] .bd-ground{background:radial-gradient(circle at 20% 70%,rgba(0,0,0,.18) 0 6%,transparent 7%),radial-gradient(circle at 70% 40%,rgba(0,0,0,.15) 0 5%,transparent 6%),linear-gradient(#6b5446,#4a3a30)}
.arena2[data-bd=cave] .pad{background:radial-gradient(ellipse at 50% 45%,#8b7262 0 52%,#5c493d 53% 70%,transparent 71%)}
.arena2[data-bd=cave] .plate2,.arena2[data-bd=volcano] .plate2,.arena2[data-bd=city] .plate2{box-shadow:0 6px 20px -8px rgba(0,0,0,.6)}
/* beach */
.arena2[data-bd=beach] .bd-sky{background:linear-gradient(#5fb8f2,#bfe8ff 90%)}
.arena2[data-bd=beach] .bd-far{top:40%;height:22%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 18px,transparent 18px 60px) 0 6px/100% 3px no-repeat,linear-gradient(#2d8fd3,#58b9e8)}
.arena2[data-bd=beach] .bd-ground{background:radial-gradient(circle at 30% 60%,rgba(255,255,255,.35) 0 1.5px,transparent 2px) 0 0/18px 14px,linear-gradient(#f6e2a8,#e8c97f)}
.arena2[data-bd=beach] .pad{background:radial-gradient(ellipse at 50% 45%,#fff3cf 0 52%,#e2c27a 53% 70%,transparent 71%)}
/* snowfield */
.arena2[data-bd=snow] .bd-sky{background:linear-gradient(#a9c9e8,#e9f3fb)}
.arena2[data-bd=snow] .bd-far{background:conic-gradient(from 135deg at 20% 0,transparent 0,transparent 0) ,linear-gradient(135deg,transparent 48%,#d6e4f2 48% 52%,transparent 52%) 0 100%/40% 100% no-repeat,radial-gradient(ellipse 26% 100% at 22% 100%,#c9d9ea 98%,transparent 100%),radial-gradient(ellipse 32% 120% at 70% 100%,#bccfe3 98%,transparent 100%)}
.arena2[data-bd=snow] .bd-ground{background:radial-gradient(circle at 40% 40%,#fff 0 1.5px,transparent 2px) 0 0/22px 18px,linear-gradient(#f6fbff,#dbe8f4)}
.arena2[data-bd=snow] .pad{background:radial-gradient(ellipse at 50% 45%,#ffffff 0 52%,#c3d6e8 53% 70%,transparent 71%)}
/* volcano */
.arena2[data-bd=volcano] .bd-sky{background:linear-gradient(#2a0d10,#7a2418 80%)}
.arena2[data-bd=volcano] .bd-far{background:radial-gradient(ellipse 28% 100% at 30% 100%,#3a1a14 98%,transparent 100%),radial-gradient(ellipse 22% 80% at 80% 100%,#2e1410 98%,transparent 100%)}
.arena2[data-bd=volcano] .bd-ground{background:linear-gradient(170deg,transparent 0 40%,rgba(255,120,30,.55) 41% 43%,transparent 44%),linear-gradient(10deg,transparent 0 62%,rgba(255,150,40,.5) 63% 64.5%,transparent 66%),linear-gradient(#4a2219,#2c1410)}
.arena2[data-bd=volcano] .bd-sky::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,#ffb347 0 1.5px,transparent 2px) 0 0/40px 50px;opacity:.7;animation:embers 6s linear infinite}
@keyframes embers{to{background-position:0 -100px}}
.arena2[data-bd=volcano] .pad{background:radial-gradient(ellipse at 50% 45%,#6d3a2c 0 52%,#3d1d16 53% 70%,transparent 71%)}
/* city at night */
.arena2[data-bd=city] .bd-sky{background:radial-gradient(circle at 80% 20%,#fff8d6 0 3%,transparent 3.5%),radial-gradient(circle,#fff 0 1px,transparent 1.5px) 0 0/60px 46px,linear-gradient(#0d1530,#2a3561)}
.arena2[data-bd=city] .bd-far{top:24%;height:38%;background:linear-gradient(transparent 0 30%,#141b33 30%) 0 0/9% 100% repeat-x,linear-gradient(transparent 0 55%,#1b2342 55%) 4% 0/7% 100% repeat-x,repeating-linear-gradient(90deg,rgba(255,226,140,.35) 0 3px,transparent 3px 14px) 0 60%/100% 30% no-repeat}
.arena2[data-bd=city] .bd-ground{background:repeating-linear-gradient(90deg,#f2d36b 0 40px,transparent 40px 80px) 0 52%/100% 4px no-repeat,linear-gradient(#3a3f52,#262a38)}
.arena2[data-bd=city] .pad{background:radial-gradient(ellipse at 50% 45%,#5b6278 0 52%,#3a4053 53% 70%,transparent 71%)}

/* fighters and pads */
.fighter2{position:absolute;z-index:3;display:grid;place-items:end center}
.fighter2.foe{right:8%;top:9%;width:min(27%,200px);aspect-ratio:1}
.fighter2.me{left:6%;bottom:23%;width:min(27%,200px);aspect-ratio:1}
.fighter2 .mon-art img{object-position:50% 100%}
.fighter2 .pad{position:absolute;left:-12%;right:-12%;bottom:-6%;height:30%;z-index:-1}
.fighter2 .mon-art{width:100%;height:100%;display:grid;place-items:end center;position:relative}
.fighter2 .mon-art img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 8px 6px rgba(0,0,0,.28));transition:transform .5s,opacity .5s}
.fighter2.me .mon-art img{transform:scaleX(-1)}
.fighter2.fainted .mon-art img{opacity:0;transform:translateY(30%) scale(.8)}
.fighter2.me.fainted .mon-art img{transform:scaleX(-1) translateY(30%) scale(.8)}
.sendout{animation:sendout .75s cubic-bezier(.2,.8,.3,1.2)}
@keyframes sendout{0%{transform:scale(.1);filter:brightness(4)}60%{transform:scale(1.08);filter:brightness(1.6)}100%{transform:none;filter:none}}
.faintfx{animation:faintfx .9s ease}
@keyframes faintfx{0%{transform:none}100%{transform:translateY(20%)}}
.statup::after,.statdown::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(255,120,90,.55) 14px 18px);mask:linear-gradient(transparent,#000 30% 70%,transparent);animation:arrowsUp .8s linear}
.statdown::after{background:repeating-linear-gradient(90deg,transparent 0 14px,rgba(90,140,255,.55) 14px 18px);animation:arrowsDown .8s linear}
@keyframes arrowsUp{from{transform:translateY(40%);opacity:0}30%{opacity:1}to{transform:translateY(-40%);opacity:0}}
@keyframes arrowsDown{from{transform:translateY(-40%);opacity:0}30%{opacity:1}to{transform:translateY(40%);opacity:0}}
.statusfx img{animation:statusfx .8s ease}
.mon-art[data-fx=brn].statusfx img{--fx:#ff6a2b}.mon-art[data-fx=par].statusfx img{--fx:#ffd21f}.mon-art[data-fx=psn].statusfx img,.mon-art[data-fx=tox].statusfx img{--fx:#b24ad6}.mon-art[data-fx=slp].statusfx img{--fx:#9aa3b8}.mon-art[data-fx=frz].statusfx img{--fx:#7fe3ff}
@keyframes statusfx{40%{filter:drop-shadow(0 0 16px var(--fx,#fff)) brightness(1.3) saturate(1.4)}}
.healfx img{animation:healfx .8s ease}
@keyframes healfx{40%{filter:drop-shadow(0 0 18px #5fe08a) brightness(1.25)}}
.shieldfx::before{content:"";position:absolute;inset:-4%;border-radius:50%;border:3px solid rgba(120,220,255,.9);background:radial-gradient(circle,transparent 55%,rgba(120,220,255,.35));animation:shield .8s ease forwards;pointer-events:none}
@keyframes shield{from{transform:scale(.6);opacity:0}40%{opacity:1}to{transform:scale(1.05);opacity:0}}
.fieldfx{animation:fieldfx .9s ease}
@keyframes fieldfx{40%{filter:saturate(1.4) brightness(1.08)}}
.roomfx{animation:roomfx .9s ease}
@keyframes roomfx{30%{filter:hue-rotate(60deg) saturate(1.6)}60%{filter:hue-rotate(-40deg)}}

/* plates */
.plate2{position:absolute;z-index:5;display:grid;gap:5px;width:min(42%,290px);text-align:left;cursor:pointer;background:color-mix(in srgb,var(--surface) 94%,transparent);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:0 6px 18px -10px rgba(0,0,0,.45)}
.plate2:hover{border-color:var(--accent)}
.plate2.foe{left:3%;top:6%}
.plate2.me{right:3%;bottom:26%}
.p-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.p-top b{font-family:var(--display);font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-top .mono{white-space:nowrap;flex-shrink:0}
.p-types{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.p-types .type{font-size:9.5px;padding:1px 6px}
.p-bot{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:18px}
.plate2 .hp{height:9px}
.boost.up{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.boost.down{color:var(--up);border-color:color-mix(in srgb,var(--up) 50%,var(--line))}
.fieldtags{position:absolute;z-index:5;display:flex;flex-wrap:wrap;gap:4px;max-width:46%}
.arena2[data-fmt=doubles]{height:clamp(420px,56vw,560px)}
.arena2[data-fmt=doubles] .fighter2.foe{width:min(21%,160px)}
.arena2[data-fmt=doubles] .fighter2.foe.pp0{right:29%;top:9%}
.arena2[data-fmt=doubles] .fighter2.foe.pp1{right:6%;top:4%}
.arena2[data-fmt=doubles] .fighter2.me{width:min(21%,160px)}
.arena2[data-fmt=doubles] .fighter2.me.pp0{left:3%;bottom:26%}
.arena2[data-fmt=doubles] .fighter2.me.pp1{left:27%;bottom:23%}
.arena2[data-fmt=doubles] .plate2{padding:5px 10px;gap:2px}
.arena2[data-fmt=doubles] .plate2 .dots{display:none}
.arena2[data-fmt=doubles] .plate2 .p-top b{font-size:14px}
.platecol{position:absolute;z-index:5;display:flex;flex-direction:column;gap:6px;width:min(36%,250px)}
.platecol.foe{left:2%;top:3%}
.platecol.me{right:2%;bottom:25%}
.platecol .plate2{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:100%}
.arena2[data-fmt=doubles] .plate2.gone{opacity:.45}
.arena2[data-fmt=doubles] .fieldtags.me{bottom:auto;top:calc(3% + 28px);left:auto;right:3%;display:none}
.fighter2[hidden],.plate2[hidden]{display:none!important}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.dchip{font-size:12px;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;background:var(--surface-2)}
.effrow{display:flex;flex-wrap:wrap;gap:4px}
.effrow .eff{font-size:9.5px;padding:1px 5px}
.tgtgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tgtbtn{display:grid;justify-items:center;gap:4px;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;background:var(--surface);cursor:pointer;color:var(--ink);min-width:0}
.tgtbtn:hover,.tgtbtn:focus-visible{border-color:var(--accent)}
.tgtbtn img{width:64px;height:64px;object-fit:contain}
.tgtbtn b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fieldtags.foe{right:3%;top:calc(3% + 28px);justify-content:flex-end}
.fieldtags.me{left:3%;bottom:26%}
.globaltags{position:absolute;z-index:5;right:3%;top:3%;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;max-width:46%}
.ftag{font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:6px;padding:2px 7px;background:rgba(20,26,40,.72);color:#fff;white-space:nowrap}
.ftag.rock{background:rgba(120,90,50,.85)}.ftag.psn{background:rgba(120,50,150,.85)}.ftag.scr{background:rgba(40,110,200,.85)}.ftag.room{background:rgba(170,60,200,.85)}
.ftag.wx-rain{background:rgba(40,100,200,.85)}.ftag.wx-sun{background:rgba(220,120,20,.9)}.ftag.wx-sand{background:rgba(170,130,60,.9)}.ftag.wx-snow{background:rgba(110,160,200,.9)}

/* dialog box like the games */
.dialog{position:absolute;z-index:7;left:2%;right:2%;bottom:3%;min-height:20%;background:rgba(18,24,38,.88);color:#fff;border:2px solid rgba(255,255,255,.75);border-radius:12px;padding:10px 16px;font-size:clamp(14px,1.6vw,17px);font-weight:600;line-height:1.35;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 8px 24px -10px rgba(0,0,0,.6)}
.dialog .caret{font-size:11px;opacity:.7;animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.dialog.newline #dialog-text{animation:typein .35s ease}
@keyframes typein{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.abpop{position:absolute;z-index:8;top:42%;padding:7px 14px;border-radius:8px;background:linear-gradient(90deg,#fbd34d,#f59e0b);color:#2b1a00;font-weight:800;font-family:var(--display);box-shadow:0 6px 16px -6px rgba(0,0,0,.5);animation:abpop 1.5s ease forwards;white-space:nowrap}
.abpop.me{left:2%}.abpop.foe{right:2%}
@keyframes abpop{0%{opacity:0;transform:translateX(var(--dx,-30px))}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.abpop.foe{--dx:30px}

/* weather overlays */
.wx[data-w=rain]{background:repeating-linear-gradient(105deg,transparent 0 14px,rgba(190,220,255,.45) 14px 15px,transparent 15px 34px);background-size:120px 120px;animation:rain .45s linear infinite}
@keyframes rain{to{background-position:-30px 120px}}
.wx[data-w=sun]{background:radial-gradient(circle at 8% 0,rgba(255,236,150,.75),rgba(255,200,80,.25) 30%,transparent 55%);animation:sunpulse 3s ease-in-out infinite}
@keyframes sunpulse{50%{opacity:.7}}
.wx[data-w=sand]{background:radial-gradient(circle,rgba(200,160,90,.6) 0 1.5px,transparent 2px) 0 0/26px 22px,linear-gradient(rgba(210,170,100,.28),rgba(210,170,100,.28));animation:sand 1.2s linear infinite}
@keyframes sand{to{background-position:-104px 22px,0 0}}
.wx[data-w=snow]{background:radial-gradient(circle,#fff 0 2px,transparent 2.5px) 0 0/40px 40px,radial-gradient(circle,rgba(255,255,255,.8) 0 1.5px,transparent 2px) 20px 10px/30px 30px;animation:snow 3s linear infinite}
@keyframes snow{to{background-position:20px 120px,0 90px}}

/* info panel and team summary */
.bt-info{border:1.5px solid var(--line);border-top:0;background:var(--surface);padding:14px 18px;display:grid;gap:10px}
.info-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.info-grid .span2{grid-column:1 / -1}
.info-grid .label{margin:0 0 6px}
.boostgrid{display:flex;flex-wrap:wrap;gap:6px}
.bi{border:1.5px solid var(--line);border-radius:8px;padding:4px 8px;font-size:13px}
.bi.up{border-color:var(--good)}.bi.down{border-color:var(--up)}
.bt-side{display:grid;gap:10px;align-content:start;max-height:calc(100vh - 140px);overflow:hidden;position:sticky;top:90px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:7px 10px;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#bt-team{overflow-y:auto;display:grid;gap:8px;max-height:calc(100vh - 230px);padding-right:4px}
.pv-foes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.pv-foe{display:grid;justify-items:center;gap:3px;border:1.5px solid var(--line);border-radius:12px;padding:8px 6px;background:var(--surface-2);text-align:center;min-width:0}
.pv-foe b{font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-foe-art img{width:72px;height:72px;object-fit:contain}
.pv-foe .p-types{justify-content:center}
.pv-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pv-row{display:grid;grid-template-columns:52px 64px minmax(0,1fr) auto;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface-2);transition:border-color .15s,transform .15s}
.pv-row[draggable]{cursor:grab}
.pv-row.lead{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.pv-row.dragging{opacity:.45}
.pv-row.dropto{border-style:dashed;border-color:var(--ink)}
.pv-row.benched{opacity:.55}
.pv-cut{list-style:none;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;margin:6px 0 2px}
.pv-cut::before,.pv-cut::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.pv-row.pv-moved{animation:pvmoved .5s ease}
@keyframes pvmoved{0%{transform:scale(.98);background:color-mix(in srgb,var(--accent) 20%,var(--surface-2))}100%{transform:none}}
.pv-num{font-family:var(--display);font-weight:800;font-size:20px;text-align:center}
.pv-row.lead .pv-num{font-size:12px;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:6px 0}
.pv-art img{width:64px;height:64px;object-fit:contain}
.pv-info{display:grid;gap:4px;min-width:0}
.pv-meta{font-size:12.5px}
.pv-btns{display:flex;gap:6px;align-items:center}
.iconbtn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px;color:var(--ink)}
.iconbtn:disabled,.pv-btns .btn:disabled{opacity:.35;cursor:default}
.pv-status{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
@media (max-width:760px){
  .pv-foes{grid-template-columns:repeat(3,minmax(0,1fr))}
  .pv-row{grid-template-columns:40px 48px minmax(0,1fr);row-gap:8px}
  .pv-art img{width:48px;height:48px}
  .pv-btns{grid-column:1 / -1;justify-content:flex-end}
  .pv-foe-art img{width:60px;height:60px}
}
.tm{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:8px;background:var(--surface-2)}
.tm.active{border-color:var(--accent)}
.tm.out{opacity:.5}
.tm-art img{width:56px;height:56px;object-fit:contain}
.tm-body{display:grid;gap:4px;min-width:0}
.tm-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tm-head b{font-family:var(--display)}
.pill{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px}
.tm .hp{height:7px}
.tm-meta{font-size:12px}
.tm-moves{display:flex;flex-wrap:wrap;gap:4px}
.tmv{font-size:11px;border-left:4px solid var(--tc);background:var(--surface);border-radius:5px;padding:2px 6px}
.tm-mu{display:flex;flex-wrap:wrap;gap:4px}
.mu{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;border:1.5px solid var(--line);color:var(--muted)}
.mu.good{border-color:var(--good);color:var(--good)}.mu.bad{border-color:var(--up);color:var(--up)}
.tm .btn.sm{justify-self:start;padding:4px 10px;font-size:12px}
.blog{max-height:calc(100vh - 230px)}
.blog p.ab{color:var(--warn);font-weight:600}
@media (max-width:860px){
  .battle2{grid-template-columns:minmax(0,1fr)}
  .bt-side{position:static;max-height:none}
  #bt-team,.blog{max-height:420px}
  .arena2{height:clamp(390px,112vw,450px)}
  .fighter2.foe{top:6%;right:5%}
  .plate2{width:min(52%,240px);padding:6px 9px;gap:3px}
  .p-top b{font-size:13px}
  .plate2.me{bottom:27%}
  .fighter2.me{bottom:24%;width:34%}
  .fighter2.foe{width:34%}
  .fieldtags{display:none}
  .info-grid{grid-template-columns:minmax(0,1fr)}
  .arena2[data-fmt=doubles]{height:clamp(470px,128vw,560px)}
  .platecol{width:min(47%,230px);gap:4px}
  .platecol.me{bottom:25%}
  .arena2[data-fmt=doubles] .fighter2.foe{width:29%}
  .arena2[data-fmt=doubles] .fighter2.foe.pp0{right:27%;top:21%}
  .arena2[data-fmt=doubles] .fighter2.foe.pp1{right:2%;top:16%}
  .arena2[data-fmt=doubles] .fighter2.me{width:29%}
  .arena2[data-fmt=doubles] .fighter2.me.pp0{left:1%;bottom:25%}

  .tgtgrid{grid-template-columns:repeat(2,minmax(0,1fr))}

}
@media (prefers-reduced-motion:reduce){.wx,.terrain{animation:none!important}}

.bt-main .controls{border-radius:0 0 18px 18px;border-top:0}

/* move tooltips */
.mvtip{position:fixed;z-index:40;max-width:min(320px,calc(100vw - 16px));background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:0 14px 32px -12px rgba(0,0,0,.45);display:grid;gap:6px;pointer-events:none;font-size:13px}
.tip-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tip-head b{font-family:var(--display);font-size:16px}
.tip-stats{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.tip-desc{margin:0;line-height:1.45}
.tip-vs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tip-warn{font-size:12px;color:var(--warn);font-weight:600}
.tmv{cursor:help}
.mvbtn{-webkit-touch-callout:none}

/* rooms */
.roomstrip{position:sticky;top:73px;z-index:4;background:color-mix(in srgb,var(--accent) 9%,var(--surface));border-bottom:1px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rs-inner{max-width:1180px;margin:0 auto;display:flex;gap:6px 16px;align-items:center;flex-wrap:wrap;font-size:14px}
.rs-code{font-weight:700}
.rs-rules{flex:1 1 220px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.roomgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.players{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.players li{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface-2)}
.players li.waiting{border-style:dashed}
.players .who{font-weight:700}
.mode.static{cursor:default}
.mode.static:hover{border-color:var(--line)}
.mode.online input{border:1.5px solid var(--line);background:var(--surface-2);border-radius:999px;padding:8px 12px;width:100px;text-transform:uppercase;letter-spacing:.12em}
.roompanel{border-color:var(--accent)}
@media (max-width:860px){ .roomgrid{grid-template-columns:minmax(0,1fr)} .roomstrip{top:0;position:static} }

/* rerolls, two-each, items */
.sheet.four{grid-template-rows:auto auto minmax(0,1fr) auto}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .mono{font-size:22px;font-weight:700;min-width:2ch;text-align:center}
.rrleft{align-self:center;font-size:14px;color:var(--muted);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px}
.rrbtn{justify-self:start;align-self:start;margin-top:2px}
.card .info .rrbtn{margin-top:4px}
.src.full{opacity:.4}
.srcgrid .k.missing{color:var(--up)}
.twonote{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cnt{font-size:12px;font-weight:600;border:1.5px solid var(--warn);color:var(--warn);border-radius:999px;padding:3px 10px}
.cnt.ok{border-color:var(--good);color:var(--good)}
.itempick .itemrow{display:flex;align-items:center;gap:8px;min-width:0}
.itempick img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated}
.works{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;margin-left:6px;border:1.5px solid var(--good);color:var(--good);white-space:nowrap}
.pop{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:5px;padding:2px 6px;margin-left:6px;border:1.5px solid var(--line);color:var(--muted)}
.itlist{border-top:1px solid var(--line)}
.itrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 18px;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr);gap:2px 12px;align-items:center}
.itrow:hover,.itrow:focus-visible{background:var(--surface-2)}

.itico{grid-row:span 2;width:40px;height:40px;display:grid;place-items:center;background:var(--surface-2);border-radius:10px}

.itname{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.itrow .mvd{grid-column:2}

/* move picker */
.movepick{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;cursor:pointer}
.movepick:hover{border-color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;padding:0}

.stab{font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:1px 6px;margin-left:6px;border:1.5px solid var(--good);color:var(--good);vertical-align:1px}
body.noscroll{overflow:hidden}
.sheet-backdrop{position:fixed;inset:0;z-index:30;overflow:hidden;background:color-mix(in srgb,#05080f 55%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:min(860px,100%);max-height:100%;height:min(760px,100%);background:var(--surface);border:1.5px solid var(--line);border-radius:18px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto;overflow:hidden;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
