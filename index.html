.sheet-head h3{font-size:20px}
.sheet-controls{display:flex;flex-wrap:wrap;gap:10px;padding:0 18px 12px;align-items:center}
.sheet-controls input,.sheet-controls select{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px}
#mv-q{flex:1 1 260px;min-width:0}
.mvhead,.mvrow{display:grid;grid-template-columns:78px minmax(0,1fr) 70px 46px 46px 38px;gap:4px 10px;align-items:center}
.mvhead{padding:8px 18px;border-block:1px solid var(--line);background:var(--surface-2)}
.mvhead button{border:0;background:none;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);cursor:pointer;text-align:left;padding:0}
.mvhead button.on{color:var(--accent)}
.mvlist{overflow-y:auto;overscroll-behavior:contain}
.mvrow{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:10px 18px;cursor:pointer}
.mvrow:hover:not([disabled]),.mvrow:focus-visible{background:var(--surface-2)}
.mvrow.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.mvrow[disabled]{opacity:.5;cursor:not-allowed}
.mvrow .type{font-size:10px;padding:2px 7px}
.mvname{font-weight:700;font-size:15px;min-width:0;overflow-wrap:anywhere}
.mvcat{font-size:12px;color:var(--muted)}
.mvd{grid-column:2 / -1;font-size:13px;color:var(--muted);line-height:1.4}
/* competitive builds */
.bd-entry{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;position:relative;overflow:hidden;border-color:color-mix(in srgb,var(--accent) 35%,var(--line));background:linear-gradient(100deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface) 60%)}
.bd-entry::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
.bd-entry-main{display:flex;gap:14px;align-items:flex-start;min-width:0;flex:1 1 320px}
.bd-entry h3{font-size:19px}
.bd-badge{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.bd-sum{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.bd-sum:empty{display:none}
.bd-count{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--ink);color:var(--surface)}
.bd-applied{animation:bdpop .9s ease}
@keyframes bdpop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.bdlist{overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start;border-top:1px solid var(--line);padding-top:14px}
.bd-card{display:grid;gap:10px;align-content:start;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--surface);min-width:0;transition:border-color .15s,box-shadow .15s}
.bd-card:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));box-shadow:0 10px 24px -16px rgba(0,0,0,.4)}
.bd-card.skel{min-height:150px}
.bd-card.skel .shimmer{display:block;border-radius:6px}
.bd-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bd-title{min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.bd-title h4{width:100%;margin:2px 0 0;font-family:var(--display);font-size:17px;line-height:1.15;overflow-wrap:anywhere}
.bd-fmt{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border-radius:6px;padding:2px 7px;background:var(--accent);color:var(--accent-ink)}
.bd-fmt.dbl{background:#7c55e8;color:#fff}
.bd-fmt.rb{background:var(--surface-2);color:var(--muted);border:1.5px solid var(--line)}
.bd-part{font-size:11px;font-weight:700;color:var(--muted)}
.bd-gear{display:flex;flex-wrap:wrap;gap:6px}
.bd-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px 3px 8px;background:var(--surface-2);min-width:0}
.bd-pill img{width:20px;height:20px;object-fit:contain;margin:-2px 0}
.bd-pill small{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bd-pill.muted{color:var(--muted)}
.bd-pill .teragem{width:12px;height:12px}
.bd-evs{display:grid;gap:5px}
.bd-evs .mono{font-size:12px;color:var(--muted)}
.evbar{display:flex;height:7px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.evbar i{display:block;min-width:4px}
.bd-moves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.bd-mv{display:grid;font-size:13px;font-weight:600;border-left:4px solid var(--tc);background:var(--surface-2);border-radius:6px;padding:5px 8px;min-width:0;overflow-wrap:anywhere}
.bd-mv small{font-size:11px;font-weight:500;color:var(--muted)}
.bd-mv.miss{opacity:.55;text-decoration:line-through}
.bd-warn{margin:0;font-size:12px;color:var(--warn);font-weight:600}
.bd-empty{grid-column:1 / -1;padding:24px 4px;text-align:center}
#bd-controls{padding-bottom:10px}
.sheet.builds{width:min(1280px,100%);height:min(1000px,100%)}
.sheet.builds .bdlist{grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px;padding:14px 20px 22px}
.sheet.builds .sheet-head{padding:14px 20px 8px}
.sheet.builds .sheet-controls{padding-left:20px;padding-right:20px}
@media (max-width:760px){ .sheet.builds .bdlist{grid-template-columns:minmax(0,1fr);padding:12px 12px 16px} }
#bd-controls .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin;padding-bottom:4px;max-width:100%}
#bd-controls .seg label{flex:none}
.bd-empty b{font-family:var(--display);font-size:18px}
@media (max-width:760px){ .bdlist{grid-template-columns:minmax(0,1fr);padding:12px 12px 16px} .bd-entry .row{width:100%} .bd-entry .row .btn.primary{flex:1;justify-content:center} }
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line)}
@media (max-width:640px){
  .sheet-backdrop{padding:0}
  .sheet{height:100%;border-radius:0;border:0}
  .mvhead,.mvrow{grid-template-columns:64px minmax(0,1fr) 40px 40px 32px}
  .mvhead button[data-sort="cat"],.mvcat{display:none}
  .mvhead,.mvrow,.sheet-head,.sheet-controls,.sheet-foot{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
  .setgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:1000px) and (min-width:641px){ .setgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* terastallization */
.terarow{display:flex;align-items:center;gap:10px}
.terarow select{flex:1;min-width:0}
.teragem{display:inline-block;width:18px;height:18px;flex:none;background:var(--tc);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.terabtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--tc);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer}
.terabtn:hover{background:color-mix(in srgb,var(--tc) 12%,var(--surface))}
.terabtn.on{background:var(--tc);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.3);box-shadow:0 0 0 4px color-mix(in srgb,var(--tc) 30%,transparent);animation:terapulse 1.4s ease-in-out infinite}
@keyframes terapulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--tc) 18%,transparent)}}
.st.tera{background:var(--tc);text-shadow:0 1px 1px rgba(0,0,0,.35)}
.mon-art.crystal img{filter:drop-shadow(0 0 10px var(--tc)) saturate(1.25) brightness(1.08)}
.mon-art.crystal::after{content:"";position:absolute;left:50%;top:-4%;width:34%;aspect-ratio:1;transform:translateX(-50%);background:var(--tc);clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);opacity:.9;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6);animation:crown 2.4s ease-in-out infinite;pointer-events:none}
@keyframes crown{50%{transform:translateX(-50%) translateY(-5px)}}
.callout.tera{background:linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#fff));letter-spacing:.02em}
.shatter{position:absolute;inset:6%;z-index:3;pointer-events:none;background:conic-gradient(from 0deg,transparent 0 8%,var(--tc) 8% 12%,transparent 12% 25%,color-mix(in srgb,var(--tc) 60%,#fff) 25% 29%,transparent 29% 45%,var(--tc) 45% 49%,transparent 49% 62%,color-mix(in srgb,var(--tc) 60%,#fff) 62% 66%,transparent 66% 82%,var(--tc) 82% 86%,transparent 86%);border-radius:50%;animation:shatter 1s ease-out forwards;mask:radial-gradient(circle,transparent 30%,#000 32%)}
@keyframes shatter{0%{opacity:0;transform:scale(.4) rotate(0)}30%{opacity:1}100%{opacity:0;transform:scale(1.4) rotate(40deg)}}

/* battle effects */
.mvtop{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap}
.eff{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:5px;padding:2px 6px;border:1.5px solid var(--line);color:var(--muted)}
.eff.good{border-color:var(--good);color:var(--good)}
.eff.bad{border-color:var(--warn);color:var(--warn)}
.eff.none{border-color:var(--up);color:var(--up)}
.arena{position:relative}
.fighter{position:relative}
.mon-art{position:relative}
.callout{position:absolute;left:50%;top:44%;z-index:9;transform:translate(-50%,-50%);background:var(--tc);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);font-family:var(--display);font-weight:800;font-size:22px;padding:8px 18px;border-radius:999px;box-shadow:0 8px 24px -8px rgba(0,0,0,.45);white-space:nowrap;animation:callout 1.05s ease forwards;pointer-events:none}
@keyframes callout{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(.96)}}
.lunge-me{animation:lungeMe .6s ease}
.lunge-foe{animation:lungeFoe .6s ease}
@keyframes lungeMe{0%,100%{transform:none}40%{transform:translate(34px,-22px) scale(1.06)}}
@keyframes lungeFoe{0%,100%{transform:none}40%{transform:translate(-34px,22px) scale(1.06)}}
.hit{animation:hit .6s ease}
@keyframes hit{0%,100%{transform:none;filter:none}15%{transform:translateX(-10px);filter:brightness(2.2) saturate(.3)}30%{transform:translateX(9px)}45%{transform:translateX(-7px);filter:brightness(1.6)}60%{transform:translateX(5px);filter:none}80%{transform:translateX(-2px)}}
.dodge{animation:dodge .6s ease}
@keyframes dodge{0%,100%{transform:none;opacity:1}40%{transform:translateX(26px);opacity:.55}}
.glow{animation:glow .7s ease}
@keyframes glow{0%,100%{filter:none}40%{filter:drop-shadow(0 0 14px var(--accent)) brightness(1.3)}}
.burst{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.2);background:radial-gradient(circle,color-mix(in srgb,var(--tc) 85%,#fff) 0 30%,var(--tc) 45%,transparent 70%);opacity:.95;animation:burst .65s ease-out forwards;pointer-events:none;z-index:2}
@keyframes burst{to{transform:translate(-50%,-50%) scale(1.5);opacity:0}}
.floattxt{position:absolute;left:50%;top:8px;z-index:4;transform:translateX(-50%);font-family:var(--display);font-weight:800;font-size:16px;padding:4px 12px;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);white-space:nowrap;animation:floatup 1.3s ease forwards;pointer-events:none}
.floattxt.good{color:var(--good);border-color:var(--good)}
.floattxt.bad{color:var(--warn);border-color:var(--warn)}
.floattxt.crit{color:var(--up);border-color:var(--up);top:44px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-18px)}}

/* fully evolved previews */
.finals{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.final{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.final.compact{grid-template-columns:40px minmax(0,1fr);align-items:center;gap:8px}
.final-art{aspect-ratio:1;max-width:100%;border-radius:10px;background:var(--surface-2)}
.final-art img{width:100%;height:100%;object-fit:contain}
.final-info{display:grid;gap:5px;min-width:0}
.final-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.final-head b{font-family:var(--display);font-size:15px}
.final .types .type{font-size:10px;padding:2px 7px}
.mini6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px 4px;font-size:11px;text-align:center}
.mini6 span{color:var(--muted);font-weight:600}
.mini6 b{font-size:13px}
.final .note{font-size:12px}
.pfin{width:100%}

/* fusion */
.mode .tag.alt{background:var(--ink);color:var(--bg)}
.card.static{cursor:default}
.card.static:hover{transform:none;border-color:var(--line);box-shadow:none}
.card.static.mega:hover{border-color:transparent}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.part{border:1.5px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;align-content:start;background:var(--surface-2);min-width:0}
.part.mega{border-color:#b77bff}
.part-art{aspect-ratio:1;max-width:120px;justify-self:center;width:100%}
.part-art img{width:100%;height:100%;object-fit:contain}
.part-info{display:grid;gap:5px;justify-items:start;min-width:0}
.part-info b{font-family:var(--display);font-size:16px;overflow-wrap:anywhere}
.part-evo{display:flex;flex-wrap:wrap;gap:6px}
.srcgrid{display:grid;grid-template-columns:52px repeat(3,minmax(0,1fr));gap:6px;align-items:center}
.srchead{font-size:12px;font-weight:600;color:var(--muted);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcgrid .k{font-size:12px;font-weight:700;color:var(--muted)}
.src{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0;font-family:var(--mono);font-weight:700;cursor:pointer}
.src:hover{border-color:var(--accent)}
.src.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sprites{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sprpick{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;display:grid;justify-items:center;gap:4px;cursor:pointer;font-size:12px;font-weight:600;min-width:0}
.sprpick img{width:72px;height:72px;object-fit:contain}
.sprpick span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sprpick.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}

/* team screen extras */
.err{color:var(--up);margin:0}
.namefield{display:flex;align-items:center;gap:8px}
.namefield input,#joincode{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;width:150px;max-width:100%}
#joincode{width:110px;text-transform:uppercase;letter-spacing:.12em}
.bopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bopt{border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start;background:var(--surface-2)}
.bopt h4{margin:0;font-family:var(--display);font-size:17px}
.bopt p{margin:0}
.codebox{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border:2px dashed var(--accent);border-radius:14px;padding:14px 16px}
.code{font-size:40px;font-weight:700;letter-spacing:.18em;line-height:1.1;margin:4px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;vertical-align:-1px}
@keyframes rot{to{transform:rotate(360deg)}}
.rules summary{cursor:pointer;font-weight:600}
.rules ul{margin:10px 0 0;padding-left:20px;color:var(--muted);display:grid;gap:6px;font-size:14px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg label{display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:14px}
.seg input{accent-color:var(--accent)}
.steps{margin:0;padding-left:22px;display:grid;gap:6px}
.steps a{color:var(--accent)}
.teamstack{display:grid;gap:22px;margin-top:22px}

/* battle */
.battle{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
.arena{border-radius:18px 18px 0 0;border:1.5px solid var(--line);border-bottom:0;overflow:hidden;background:linear-gradient(180deg,var(--sky) 0 52%,var(--turf) 52%);padding:18px;display:grid;gap:4px}
.arena+.controls{border-radius:0 0 18px 18px}
.fighter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,190px);align-items:center;gap:14px}
.fighter.me{grid-template-columns:minmax(0,190px) minmax(0,1fr)}
.mon-art{aspect-ratio:1;max-width:100%;display:grid;place-items:center;background:radial-gradient(ellipse 46% 13% at 50% 84%,var(--pad) 0 98%,transparent 100%)}
.mon-art img{width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 6px 6px color-mix(in srgb,var(--ink) 20%,transparent))}
.fighter.me .mon-art img{transform:scaleX(-1)}
.plate{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;gap:7px;min-width:0;max-width:340px;width:100%}
.fighter.foe .plate{justify-self:end}
.plate-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plate-top b{font-family:var(--display);font-size:18px;min-width:0;overflow-wrap:anywhere}
.plate-bot{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:20px}
.hpnum{margin-left:auto;font-size:13px}
.hp{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.hp b{display:block;height:100%;transition:width .5s}
.st{font-size:10px;font-weight:800;letter-spacing:.06em;border-radius:5px;padding:2px 6px;color:#fff}
.st.par{background:#b89400}.st.brn{background:#d7582a}.st.psn,.st.tox{background:#9442a8}.st.slp{background:#6e778c}.st.frz{background:#2b9cb4}.st.cnf{background:#c64f78}
.boost{font-size:11px;font-family:var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.dot.out{background:var(--line)}
.controls{display:grid;gap:10px}
.controls .label{margin:0}
.movegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mvbtn{border:1.5px solid var(--line);border-left:6px solid var(--tc);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:1px;cursor:pointer;min-width:0}
.mvbtn:hover:not([disabled]){border-color:var(--tc);border-left-width:6px}
.mvbtn[disabled]{opacity:.45;cursor:not-allowed}
.mvbtn b{font-size:15px}
.mvbtn span{font-size:12px;color:var(--muted)}
.bench{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.benchbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 4px;display:grid;justify-items:center;gap:1px;cursor:pointer;font-size:11px;min-width:0}
.benchbtn[disabled]{cursor:default;opacity:.55}
.benchbtn.on{border-color:var(--accent);opacity:1}
.benchbtn img{width:44px;height:44px;object-fit:contain}
.benchbtn .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.blog{max-height:620px;overflow-y:auto;font-size:13.5px;line-height:1.45;display:grid;gap:3px;align-content:start}
.blog p{margin:0}
.blog h4{font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;border-top:1px solid var(--line);padding-top:8px}
.banner{border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1.5px solid var(--line);background:var(--surface-2)}
.banner.good{border-color:var(--good)}
.banner.bad{border-color:var(--up)}
@media (max-width:860px){
  .battle,.bopts{grid-template-columns:minmax(0,1fr)}
  .bench{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fighter{grid-template-columns:minmax(0,1fr) minmax(0,120px)}

/* ============ Roguelike ============ */

/* start */

.rg-setup{position:sticky;top:76px;display:flex;flex-direction:column;gap:8px}

/* camp */

.rg-reward.claimed{opacity:.5}
.rg-rw-tier{font-size:10px;letter-spacing:.09em;text-transform:uppercase;font-weight:800;color:var(--rc)}
.rg-rw-ico{width:52px;height:52px;display:grid;place-items:center;flex:none}
.rg-rw-ico img{width:44px;height:44px;image-rendering:pixelated;object-fit:contain}
.rg-tm{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--display);color:#fff;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 60%,#fff),var(--tc) 60%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);text-shadow:0 1px 1px rgba(0,0,0,.4)}
.rg-next{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--line);margin-top:10px}

.rg-bagi{display:inline-flex;align-items:center;gap:1px;font-size:12px}
.rg-bagi .rg-ico{width:26px;height:26px}.rg-bagi .rg-ico img{width:26px;height:26px}
.rg-bagi.key{border-radius:8px;background:color-mix(in srgb,#7c55e8 12%,transparent);padding:0 4px}

/* party */
.rg-party{position:sticky;top:76px}

.rg-pm.lead{border-color:color-mix(in srgb,var(--accent) 50%,var(--line));background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,var(--surface)),var(--surface) 50%)}

/* results, prompts */
.rg-results{display:flex;flex-direction:column;gap:14px;max-width:760px}

.rg-lines{margin:0;padding-left:18px;color:var(--muted);font-size:14px}

.rg-newmove{display:flex}

.rg-choice>b{flex:1}
.rg-evo{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;max-width:620px;margin:0 auto;background:radial-gradient(ellipse at 50% 35%,#3a2a6b,#141a2b 70%);border-color:#2b3446;color:#f2f4fa}

@keyframes rgevo{0%{filter:none}15%{filter:brightness(0) invert(1)}30%,45%,60%,75%,90%{transform:scale(.7);filter:brightness(0) invert(1)}37%,52%,67%,82%,97%{transform:scale(1.08);filter:brightness(0) invert(1)}100%{transform:scale(1);filter:brightness(0) invert(1)}}
@keyframes rgglow{0%{opacity:0}100%{opacity:.85;transform:scale(1.3)}}
@keyframes rgflash{0%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(2)}}
.rg-over{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}

/* battle: bag and catching */
.rg-balls{display:flex;flex-wrap:wrap;gap:6px}
.rg-ballbtn{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 6px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;text-align:left}

.rg-ballbtn>span:last-child{display:flex;flex-direction:column;line-height:1.15;font-size:13px}

.pball.great{background:radial-gradient(circle at 50% 50%,#fff 0 16%,#222 16% 24%,transparent 24%),linear-gradient(#2f6fe4 0 46%,#222 46% 54%,#f5f5f5 54%)}

.pball.rogue{background:radial-gradient(circle at 50% 50%,#fff 0 16%,#222 16% 24%,transparent 24%),linear-gradient(135deg,#7c55e8 0 46%,#222 46% 54%,#f5f5f5 54%)}

.rg-star{position:absolute;width:14px;height:14px;margin:-7px;background:#ffd84a;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);animation:rgstar 1.1s ease-out forwards}
@keyframes rgstar{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),-46px) scale(1);opacity:0}}
@media (max-width:980px){.rg-startgrid,.rg-camp{grid-template-columns:minmax(0,1fr)}.rg-setup,.rg-party{position:static}}
@media (max-width:620px){.rg-rewards{grid-template-columns:minmax(0,1fr)}.rg-reward{display:grid;grid-template-columns:52px minmax(0,1fr);grid-template-areas:"ico tier" "ico txt";text-align:left;align-items:center;column-gap:10px;row-gap:2px}.rg-reward .rg-rw-ico{grid-area:ico}.rg-reward .rg-rw-tier{grid-area:tier}.rg-reward .rg-rw-txt{grid-area:txt}.rg-reward.bonus .rg-rw-tier{position:static}.rg-gens{grid-template-columns:minmax(0,1fr)}.rg-pm{grid-template-columns:52px minmax(0,1fr)}.rg-pm-act{grid-column:1/-1;flex-direction:row;justify-content:flex-end}.rg-pm-art,.rg-pm-art img{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.rg-evo-stage.go .rg-evo-a img,.rg-evo-stage.go .rg-evo-glow,.rg-lvup{animation:none}}

.rg-glyph{display:inline-grid;place-items:center;width:100%;height:100%;font-size:18px;color:#7c55e8}

/* roguelike v2: roster, skill tree, summary, tooltips, shortcuts */
.kbd{display:inline-block;min-width:1.6em;padding:0 5px;border:1.5px solid currentColor;border-bottom-width:2.5px;border-radius:6px;font:700 11px/1.5 var(--mono);text-align:center;opacity:.75;vertical-align:1px}

.rg-roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.rg-opt{position:relative;display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;transition:transform .12s,border-color .12s,box-shadow .12s}
.rg-opt:hover{transform:translateY(-2px)}
.rg-opt.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.rg-opt.dim{opacity:.5}
.rg-opt-main{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 6px 8px;border:0;background:none;cursor:pointer;min-width:0}
.rg-opt-main b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rg-cost{position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--ink);color:var(--surface)}
.rg-cls{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#b07800}
.rg-opt-tog{display:flex;border-top:1px solid var(--line)}
.rg-tog{flex:1;border:0;background:var(--surface-2);font-size:11px;font-weight:700;padding:5px 4px;cursor:pointer;color:var(--muted)}
.rg-tog+.rg-tog{border-left:1px solid var(--line)}
.rg-tog.on{background:linear-gradient(90deg,#fff3b0,#ffd166);color:#5a4300}
.rg-tog.mega.on{background:linear-gradient(90deg,#e0457b,#8a5cf6);color:#fff}
.rg-shinytxt{color:#e6a019}
.rg-close{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.rg-closei{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:12px;background:var(--surface-2)}
.rg-closei>div{display:flex;flex-direction:column;min-width:0;flex:1}
.rg-friend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#d6457b}
.rg-friend.done{font-weight:700}
.rg-fbar{flex:1;min-width:60px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rg-fbar i{display:block;height:100%;background:linear-gradient(90deg,#ff8fb8,#e0457b)}
.rg-budget{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.rg-bbar{height:10px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.rg-bbar i{display:block;height:100%;background:linear-gradient(90deg,#29a97b,#e6a019)}
.rg-teampick{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rg-teampick li{display:flex;align-items:center;gap:6px;padding:2px 4px 2px 2px;border-radius:12px;background:var(--surface-2)}
.rg-teampick li b{flex:1;font-size:14px}
.rg-how summary{cursor:pointer;font-weight:700;font-size:14px}
/* skill tree */
.rg-treebar{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between;margin-bottom:16px}
.rg-treebar>div:not(.row){display:flex;flex-direction:column}
.rg-treebar b{font-family:var(--display);font-size:26px}
.rg-pts{color:var(--accent)}
.rg-tree{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.rg-branch{display:flex;flex-direction:column;align-items:stretch;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px}
.rg-branch h3{font-size:16px;text-align:center;margin-bottom:10px}
.rg-link{align-self:center;width:3px;height:16px;background:var(--line);border-radius:2px}
.rg-link.on{background:var(--good)}
.rg-node{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2)}
.rg-node.has{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.rg-node.max{background:linear-gradient(180deg,color-mix(in srgb,#e6a019 14%,var(--surface)),var(--surface-2));border-color:#e6a019}
.rg-node.locked{opacity:.55}
.rg-node .note{margin:0;font-size:12px;line-height:1.35}
.rg-node-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rg-node-top b{font-size:14px;flex:1;min-width:0}
.rg-node-ic{font-size:18px}
.rg-dots{display:flex;gap:3px}
.rg-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.rg-dots i.on{background:var(--good)}
/* party card art button */
.rg-pm-art{border:0;background:none;padding:0;cursor:pointer;border-radius:12px}
.rg-pm-art:hover img{transform:scale(1.06)}
/* summary sheet */
.rg-sheetbg{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#05080f 55%,transparent)}
.rg-sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);display:flex;flex-direction:column;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden}
.rg-sh-head{display:flex;gap:14px;align-items:flex-start;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.rg-sh-id{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.rg-sh-id h3{font-size:22px}
.rg-sh-body{overflow:auto;padding:12px 18px;display:flex;flex-direction:column;gap:14px}
.rg-sh-body h4{margin:0 0 6px;font-family:var(--display);font-size:15px}
.rg-sh-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.rg-stats{display:grid;grid-template-columns:auto minmax(80px,1fr) 48px auto;gap:4px 10px;align-items:center}
.rg-sbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.rg-sbar i{display:block;height:100%}
.rg-shinybox{padding:10px 12px;border-radius:12px;background:linear-gradient(90deg,#fff3b0,#ffe6a0);color:#4a3600}
.rg-shinybox h4{color:#4a3600}
.rg-shmoves{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rg-shmove{padding:8px 10px;border-radius:12px;background:var(--surface-2);border-left:5px solid var(--tc)}
.rg-shmove p{margin:4px 0 0;font-size:12px}
.rg-shmove .types{display:inline-flex}
.rg-pp{margin-left:auto}
.rg-itemlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rg-itemlist li{display:flex;gap:8px;align-items:flex-start}
.rg-itemlist li>div{display:flex;flex-direction:column}
.rg-xp.big{height:6px;flex:none;width:100%}
/* tooltips */
.rg-tip{position:absolute;z-index:70;max-width:260px;padding:8px 10px;border-radius:10px;background:var(--ink);color:var(--surface);font-size:13px;line-height:1.35;box-shadow:0 8px 20px -8px rgba(0,0,0,.4);pointer-events:none}
.rg-mod,.rg-bagi{cursor:help}
/* unlocks, results, points */
.rg-unlocks{display:grid;gap:8px;margin-bottom:14px}
.rg-unlock{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:14px;border:2px solid #e0457b;background:linear-gradient(90deg,color-mix(in srgb,#ff8fb8 22%,var(--surface)),var(--surface));animation:rglv .7s ease}
.rg-unlock.shiny{border-color:#e6a019;background:linear-gradient(90deg,#fff3b0,var(--surface))}
.rg-unlock.mega{border-color:#8a5cf6;background:linear-gradient(90deg,color-mix(in srgb,#8a5cf6 20%,var(--surface)),var(--surface))}
.rg-unlock>div{display:flex;flex-direction:column}
.rg-heart{color:#d6457b;font-weight:700}
.rg-points{width:min(420px,100%);padding:12px 14px;border-radius:14px;background:var(--surface-2);border:1.5px solid var(--line);text-align:left}
.rg-prow{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14px}
.rg-prow.total{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:800}
.rg-healrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:10px}
.rg-rewards.many{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.rg-mvdesc{font-size:12px;margin-top:2px}
.rg-shopi>span:last-child .note:not(.mono){font-size:11px;line-height:1.3}
@media (max-width:1100px){.rg-tree{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
@media (max-width:620px){.rg-shmoves{grid-template-columns:minmax(0,1fr)}.rg-stats{grid-template-columns:auto minmax(60px,1fr) 40px}.rg-stats .note{grid-column:1/-1;margin-top:-4px}.rg-sh-head .rg-big{width:80px;height:80px}.rg-sh-head .rg-big img{width:76px;height:76px}.rg-roster{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}}
.rg-filters .cpick{flex:0 1 170px;width:auto;min-width:140px}

/* reward confirmation */
.rg-rw-key{position:absolute;top:8px;left:10px;font-size:10px;opacity:.5}
.rg-reward{position:relative}
.rg-reward.on{transform:translateY(-3px)}
.rg-reward.on::after{content:"✓";position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--rc);color:#fff;font-weight:800;font-size:13px}
.rg-rewards:has(.rg-reward.on) .rg-reward:not(.on):not(:disabled){opacity:.6}
.rg-confirm{--rc:var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-top:12px;padding:12px 14px;border-radius:14px;border:2px solid var(--rc);background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 14%,var(--surface)),var(--surface));animation:rgpop .25s ease}
.rg-confirm.t0{--rc:#9aa4b8}.rg-confirm.t1{--rc:#3b82f6}.rg-confirm.t2{--rc:#e6a019}.rg-confirm.t3{--rc:#e0457b}.rg-confirm.t4{--rc:#7c55e8}
.rg-confirm.picking{border-style:dashed;background:var(--surface-2)}
.rg-confirm-txt{flex:1 1 240px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rg-confirm-txt b{font-family:var(--display);font-size:18px}
.rg-confirm-act{display:flex;gap:8px;flex-wrap:wrap}
@keyframes rgpop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (max-width:620px){.rg-confirm-txt{flex:1 1 0}.rg-rw-key{display:none}.rg-confirm-act{width:100%}.rg-confirm-act .btn{flex:1;justify-content:center}}

.rg-preview{font-size:11px;line-height:1.25;color:var(--good);font-weight:700;text-align:center;max-width:120px}
/* shiny sparkle */
.shinystar{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px;background:radial-gradient(circle,#fff 0 25%,#ffe27a 45%,transparent 70%);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:shinystar 1.1s ease-out both;pointer-events:none;filter:drop-shadow(0 0 4px #fff6b0)}
.shinystar.big{width:22px;height:22px;margin:-11px}
@keyframes shinystar{0%{transform:translate(0,0) scale(.2) rotate(0);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg);opacity:0}}
.shinyglow img{animation:shinyglow 1s ease}
@keyframes shinyglow{0%,100%{filter:none}30%{filter:brightness(1.6) drop-shadow(0 0 12px #ffe27a)}}
/* ability picker */
.rg-teampick li{flex-direction:column;align-items:stretch}
.rg-tp-top{display:flex;align-items:center;gap:6px}
.rg-tp-top b{flex:1;font-size:14px}
.rg-abil{display:flex;flex-direction:column;gap:4px;padding:2px 6px 6px}
.rg-abil-btns{display:flex;flex-wrap:wrap;gap:4px}
.rg-abtn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer}
.rg-abtn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rg-abtn.hid:not(.on){border-style:dashed}
.rg-hidtag{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
.rg-abdesc{font-size:12px;line-height:1.35}
.rg-choice.cur{border-color:var(--good)}
/* shop confirmation */
.rg-shopi.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent);background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.rg-healrow .btn.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.rg-shopbar{margin-top:12px}
.rg-qty{display:flex;align-items:center;gap:6px;margin:4px 0}
.rg-qty b{min-width:2ch;text-align:center;font-size:16px}
.rg-qty .btn.sm{padding:4px 10px}


/* ============ co-op roguelike ============ */
.coopmode .tag{background:linear-gradient(135deg,#7b2ff7,#d8343b)}
.rg-coopbtn{width:100%;justify-content:center}
.coop-setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.coop-setup .rg-seg{flex-wrap:wrap}
#coopcode{width:110px;text-transform:uppercase;letter-spacing:.12em}
.coop-players li{flex-wrap:wrap}
.coop-players li.ready{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface-2))}
.co-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:800;margin-right:8px;flex:none}
.coop-picks{display:flex;flex-wrap:wrap;gap:0}
.coop-picks .rg-mini,.coop-team .rg-mini{width:34px;height:34px}
.coop-picks .rg-mini img,.coop-team .rg-mini img{width:34px;height:34px}
.rg-mini.out img{filter:grayscale(1);opacity:.45}
.coop-ready{margin-top:12px;display:grid;gap:10px}
.coop-team{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.coop-team li{display:grid;grid-template-columns:minmax(110px,auto) 1fr auto;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--surface-2)}
.coop-team li .who{display:flex;align-items:center}
.coop-team li.ready{border-color:var(--good)}
.coop-team li.ready .note{color:var(--good);font-weight:700}
.coop-team li.gone{opacity:.6;border-style:dashed}
.rg-next.raid{border-color:#b5179e;background:linear-gradient(135deg,color-mix(in srgb,#b5179e 10%,var(--surface-2)),var(--surface-2))}
.rg-next.raid .rg-next-av{background:#b5179e}
.coop-catches li::marker{content:"✦ "}
.rg-raidcatch{display:flex;gap:14px;align-items:center;border:2px solid #b5179e;border-radius:16px;padding:12px 14px;margin:6px 0 10px;background:color-mix(in srgb,#b5179e 7%,var(--surface))}
.rg-raidcatch.done.ok{border-color:var(--good)}
.rg-raidcatch>div{min-width:0;display:grid;gap:2px}
.rg-askbar{--rc:var(--accent);margin-top:12px}
.rg-choice.on,.btn.on{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:1px}
/* battle controls */
.coop-order{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding:0 0 10px;border-bottom:1.5px dashed var(--line)}
.coop-order .label{margin-right:4px}
.co-o{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:600;border:1.5px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;background:var(--surface-2)}
.co-o b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:11.5px;padding:0 4px}
.co-o.me{border-color:var(--accent)}
.co-o.me b{background:var(--accent);color:var(--accent-ink)}
.co-o.foe b{background:#5b6580}
.co-o.tie{border-style:dashed}
.co-o .note{font-weight:500}
.co-o-note{flex-basis:100%;font-size:11.5px}
.coop-locked{margin:0 0 6px;padding:8px 12px;border-radius:10px;background:var(--surface-2);border:1.5px solid var(--line)}
.coop-waitline{margin:4px 0 8px}
.coop-flee{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.coop-emote{position:absolute;left:50%;top:-6%;transform:translateX(-50%);z-index:9;white-space:nowrap;background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;box-shadow:0 6px 16px -8px rgba(0,0,0,.5);animation:coopemote 2.2s ease both;pointer-events:none}
@keyframes coopemote{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.co-group{margin:0 0 12px}
.co-group .label{margin:0 0 6px}
.tm.small{padding:8px}
.tm.small .tm-art{width:52px;height:52px}
/* multi-spot arena: up to 6 a side */
.arena2.multi{height:clamp(470px,60vw,620px);--colw:calc(94% / max(var(--nm),var(--nf)))}
.arena2.multi .fighter2{width:min(calc(84% / max(var(--nf),2)),170px);aspect-ratio:1}
.arena2.multi .fighter2.foe{right:auto;left:calc(4% + (92% / var(--nf)) * var(--i) + (92% / var(--nf)) / 2);transform:translateX(-50%);top:16%}
.arena2.multi .fighter2.me{width:min(calc(84% / max(var(--nm),2)),160px);left:calc(4% + (92% / var(--nm)) * var(--i) + (92% / var(--nm)) / 2);transform:translateX(-50%);bottom:36%}
.arena2.multi.raid .fighter2.foe{width:min(30%,240px);top:6%}
.arena2.multi .plate2{width:calc(92% / var(--nm) - 6px);max-width:240px;padding:4px 8px;gap:2px;transform:translateX(-50%);border-radius:10px}
.arena2.multi .plate2.foe{left:calc(4% + (92% / var(--nf)) * var(--i) + (92% / var(--nf)) / 2);top:2.5%;width:calc(92% / var(--nf) - 6px)}
.arena2.multi .plate2.me{right:auto;left:calc(4% + (92% / var(--nm)) * var(--i) + (92% / var(--nm)) / 2);bottom:24%}
.arena2.multi.raid .plate2.foe{width:min(60%,360px);max-width:none}
.arena2.multi .plate2 .p-top b{font-size:13px}
.arena2.multi .plate2 .p-top .note{font-size:10.5px}
.arena2.multi .plate2 .hp{height:7px}
.arena2.multi .plate2 .p-bot{min-height:0;gap:3px}
.arena2.multi .plate2 .p-bot .boost,.arena2.multi .plate2 .p-bot .st{font-size:9px;padding:0 4px}
.arena2.multi .plate2 .hpnum{font-size:10.5px;margin-left:auto}
.arena2.multi .plate2.gone{opacity:.42}
.arena2.multi .plate2.mine{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 40%,transparent),0 6px 18px -10px rgba(0,0,0,.45)}
.arena2.multi .fighter2.me.mine .pad{filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 70%,transparent))}
.arena2.multi .fieldtags.foe{top:auto;bottom:58%;right:2%}
.arena2.multi .fieldtags.me{bottom:46%;left:2%}
.arena2.multi .globaltags{top:auto;bottom:52%}
.arena2.multi .dialog{min-height:15%;bottom:2.5%}
.co-own{font-size:10.5px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-own.me{color:var(--accent)}
.co-rank{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:999px;background:var(--ink);color:var(--surface);font-size:10.5px;font-weight:800;padding:0 4px;margin-right:4px;flex:none}
.arena2.multi .p-top{justify-content:flex-start;gap:4px}
.arena2.multi .p-top b{flex:1;min-width:0}
@media (max-width:860px){
  .coop-setup{grid-template-columns:minmax(0,1fr)}
  .arena2.multi{height:clamp(520px,150vw,680px)}
  .arena2.multi[style*="--nm:6"] .plate2 .p-bot .boost{display:none}
  .arena2.multi .plate2{padding:3px 5px}
  .arena2.multi .plate2 .p-top b{font-size:11px}
  .arena2.multi .plate2 .p-top .note,.arena2.multi .co-own{font-size:9.5px}
  .coop-team li{grid-template-columns:1fr;gap:4px}
}

.arena2.multi .plate2{grid-template-columns:minmax(0,1fr);overflow:hidden;min-width:0}
.arena2.multi .plate2>*{min-width:0}
.arena2.multi .plate2 .p-top{overflow:hidden}
.arena2.multi .plate2 .p-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arena2.multi.cm6 .plate2.me,.arena2.multi.cf6 .plate2.foe,.arena2.multi.cm3 .plate2.me,.arena2.multi.cf3 .plate2.foe{padding:3px 5px}
.arena2.multi.cm6 .plate2.me .p-top .note,.arena2.multi.cf6 .plate2.foe .p-top .note{display:none}
.arena2.multi.cm6 .plate2.me .p-top b,.arena2.multi.cf6 .plate2.foe .p-top b{font-size:11.5px}

/* ============ draft ============ */
async function rollOptions() {
  state.error = null; state.loading = true; state.options = [null, null, null]; render();
  try {
    const pool = await candidatePool(settings);
    const taken = new Set(state.team.flatMap(m => isFusion(m) ? m.parts.map(p => p.speciesId) : [m.speciesId]));
    const mons = [];
    for (let i = 0; i < 3; i++) mons.push(await rollCandidate(pool, taken, settings));
    await Promise.all(mons.map(m => loadEvos(m).catch(() => (m.evos = []))));
    mons.forEach(rollShiny);
    state.options = mons;
  } catch (e) {
    state.error = e.message; state.options = [];
  }
  state.loading = false; render();
}
async function rerollOne(i) {
  if (state.rerolls <= 0 || state.loading || !state.options[i]) return;
  state.rerolls--;
  const keep = state.options.slice();
  state.options[i] = null; state.loading = true; render();
  try {
    const pool = await candidatePool(settings);
    const taken = new Set(state.team.flatMap(m => isFusion(m) ? m.parts.map(p => p.speciesId) : [m.speciesId]).concat(keep.filter(Boolean).map(m => m.speciesId)));
    const m = await rollCandidate(pool, taken, settings);
    await loadEvos(m).catch(() => (m.evos = []));
    rollShiny(m);
    state.options[i] = m;
  } catch (e) {
    state.options[i] = keep[i]; state.rerolls++;
    toast("Couldn’t reroll. " + e.message);
  }
  state.loading = false; render();
}
const SHINY_ODDS = 40;
function rollShiny(m) { m.shinyRoll = Math.random() < 1 / SHINY_ODDS; return m; }
const revealedUids = new Set();
async function rerollAll() {
  if (state.rerolls <= 0 || state.loading || state.options.some(x => !x)) return;
  state.rerolls--;
  const keep = state.options.slice();
  state.options = [null, null, null]; state.loading = true; render();
  try {
    const pool = await candidatePool(settings);
    const taken = new Set(state.team.flatMap(m => isFusion(m) ? m.parts.map(p => p.speciesId) : [m.speciesId]).concat(keep.map(m => m.speciesId)));
    const mons = [];
    for (let i = 0; i < 3; i++) mons.push(await rollCandidate(pool, taken, settings));
    await Promise.all(mons.map(m => loadEvos(m).catch(() => (m.evos = []))));
    mons.forEach(rollShiny);
    state.options = mons;
  } catch (e) {
    state.options = keep; state.rerolls++;
    toast("Couldn’t reroll. " + e.message);
  }
  state.loading = false; render();
}

function doublesPick(kind, val) {
  const v = currentView();
  if (!v || battle.playing) return;
  const sel = dselFor(v), req = v.request || {};
  const pos = sel.live[sel.actions.length];
  if (pos == null) return;
  if (kind === "back") {
    if (sel.pending != null) sel.pending = null;
    else if (sel.actions.length) { const a = sel.actions.pop(); sel.tera = !!a.tera; }
    return renderControls(v, false);
  }
  if (kind === "tera") { sel.tera = !sel.tera; return renderControls(v, false); }
  if (req.kind === "switch") { sel.actions.push({ type: "switch", index: val }); }
  else if (kind === "switch") { sel.actions.push({ type: "switch", index: val }); sel.tera = false; }
  else if (kind === "move") {
    const me = v.you.team[v.you.actives[pos]];
    if (val >= 0) {
      const m = shownMove(me, me.moves[val], sel.tera);
      const opts = targetOptions(v, me, m);
      if (opts.length > 1) { sel.pending = val; return renderControls(v, false); }
      const o = opts[0];
      sel.actions.push({ type: "move", index: val, tera: !!sel.tera, target: o && o.side === "foe" ? { side: "foe", pos: o.pos } : o && o.side === "ally" ? { side: "ally" } : null });
    } else sel.actions.push({ type: "move", index: val, tera: !!sel.tera, target: null });
    sel.tera = false;
  } else if (kind === "target") {
    const [side, p] = String(val).split(":");
    sel.actions.push({ type: "move", index: sel.pending, tera: !!sel.tera, target: side === "foe" ? { side: "foe", pos: +p } : side === "ally" ? { side: "ally" } : null });
    sel.pending = null; sel.tera = false;
  }
  if (sel.actions.length >= sel.live.length) { const actions = sel.actions.slice(); battle.dsel = null; return myChoose({ actions }); }
  renderControls(v, false);
}

function placeTip(el, tip) {
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = r.left + r.width / 2 - tw / 2, y = r.top - th - 10;
  if (y < 8) y = r.bottom + 10;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8));
  y = Math.max(8, Math.min(y, window.innerHeight - th - 8));
  tip.style.left = x + "px"; tip.style.top = y + "px";
}

function renderBattle() {
  if (state.screen !== "battle") return;

  if (!document.getElementById("arena") || battle.domKey !== battleKey(v)) {
    const isNew = battle.shownLine == null;
    buildBattleSkeleton(v);
    if (isNew) { battle.endDone = false; battle.lastMoveFx = null; showIntro(v); Sound.startMusic(); }
    if (battle.shownLine == null) battle.shownLine = v.logBase - 1;
    else {
      for (let i = v.logBase; i <= battle.shownLine && i < v.logBase + v.log.length; i++) appendLog(v, i);
      const st = v.steps[battle.shownLine - v.stepBase];
      if (st) applyStep(v, st, false);
    }
  }
  const lastAbs = v.logBase + v.log.length - 1;
  if (battle.shownLine < lastAbs) { if (!document.querySelector("#bt-team .tm")) renderTeamPanel(v); playLines(); return; }
  if (!battle.playing) { applyStep(v, finalStep(v), false); renderTeamPanel(v); renderControls(v, false); }
  if (battle.infoSide) { const s = battle.infoSide; battle.infoSide = null; renderInfo(s); }
}

async function rgLevelMoves(m) {

/* ---------- encounters ---------- */

/* Builds the opposing Pokémon. Species picked once are kept, so leaving and coming back meets the same team. */

/* ---------- levels, learning, evolving, Mega Evolving ---------- */
async function rgSetLevel(m, L, post) {
  const run = Rogue.run;
  const oldMax = rgMaxHp(m), from = m.build.level;
  m.build.level = Math.min(100, L);
  if (m.rg.exp < rgExpFor(m.build.level)) m.rg.exp = rgExpFor(m.build.level);
  const newMax = rgMaxHp(m);
  if (!m.rg.fainted && m.rg.hp != null) m.rg.hp = Math.min(newMax, m.rg.hp + (newMax - oldMax));
  if (post) post.lines.push(m.displayName + " grew to Lv. " + m.build.level + "!");
  let lm = [];
  try { lm = await rgLevelMoves(m); } catch (e) { lm = []; }
  const known = new Set(m.build.moves.filter(Boolean));
  const fresh = [...new Set(lm.filter(x => x.level > from && x.level <= m.build.level && !known.has(x.name)).map(x => x.name))];
  for (const n of fresh) {
    const slot = m.build.moves.findIndex(x => !x);
    if (slot >= 0) { m.build.moves[slot] = n; if (post) post.lines.push(m.displayName + " learned " + pretty(n) + "!"); }
    else if (!run.prompts.some(p => p.t === "learn" && p.uid === m.uid && p.move === n)) run.prompts.push({ t: "learn", uid: m.uid, move: n });
  }
  const ev = await rgEvoOptions(m);
  if (ev.length && !run.prompts.some(p => p.t === "evolve" && p.uid === m.uid)) run.prompts.push({ t: "evolve", uid: m.uid });
}
async function rgEvoOptions(m, force) {
  if (m.isMega || isFusion(m)) return [];
  let evos = [];
  try { evos = await loadEvos(m); } catch (e) { evos = []; }
  const d = RG_BY_ID.get(m.speciesId);
  const fallback = d && d.stage === 0 ? 30 : 42;
  return evos.filter(o => {
    if (force) return true;
    const det = (o.node && o.node.evolution_details) || [];
    const lv = det.map(x => x.min_level).filter(Boolean)[0] || fallback;
    return m.build.level >= lv;

}
async function rgTransform(m, nm, keepMoves) {

  build.teraType = nm.types[0];

function rgPickState() {

function rgRosterList() {

}

/* ---------- evolution animation ---------- */
async function rgRunEvolution(m, opt) {
  Rogue.evo = { uid: m.uid, target: { variety: opt.variety }, stopped: false };
  render();
  Sound.play("sparkle");
  const stage = document.querySelector(".rg-evo-stage");
  if (stage) stage.classList.add("go");
  const reduce = reduceMotion();
  for (let i = 0; i < (reduce ? 2 : 14); i++) { await wait(reduce ? 200 : 260); if (Rogue.evo && Rogue.evo.stopped) break; }
  const run = Rogue.run;
  if (!Rogue.evo || Rogue.evo.stopped) { Rogue.evo = null; run.prompts.shift(); Rogue.msg = m.displayName + " stopped evolving."; rgSave(); render(); return; }
  const btn = document.getElementById("rg-evo-stop"); if (btn) btn.disabled = true;
  let nm;
  try { nm = await rgEvolve(m, opt); } catch (e) { Rogue.evo = null; run.prompts.shift(); Rogue.msg = "Evolution failed to load. " + e.message; rgSave(); return render(); }
  if (stage) stage.classList.add("done");
  const t = document.getElementById("rg-evo-text");
  if (t) t.textContent = "Congratulations! Your " + m.displayName + " evolved into " + nm.displayName + "!";
  Sound.play("badge");
  if (nm.cry) Sound.cry(nm.cry);
  await wait(reduce ? 400 : 1800);
  Rogue.evo = null;
  run.prompts.shift();
  if (nm.abilities.length > 1) run.prompts.unshift({ t: "ability", uid: nm.uid, evolved: true });
  Rogue.msg = "Your " + m.displayName + " evolved into " + nm.displayName + "!";
  nm._canEvo = (await rgEvoOptions(nm, true).catch(() => [])).length > 0;
  rgSave(); render();
}

function coopChoiceText(v, a) {

  const p = rgPickState();
  const cap = coopPer(Coop.size);
  if (p.team.length > cap) p.team = p.team.slice(0, cap);
  const used = p.team.reduce((s, o) => s + rgOptCost(o), 0), budget = rgBudget();
  const slots = Array.from({ length: Coop.size }, (_, i) => Coop.players.find(x => x.idx === i));
  const players = '<ul class="players coop-players">' + slots.map((x, i) => x ? '<li class="' + (x.lobbyReady ? "ready" : "") + '"><span class="who"><span class="co-num">' + (i + 1) + "</span>" + esc(x.name) + (i === Coop.me ? ' <span class="note">(you)</span>' : "") + (i === 0 ? ' <span class="note">host</span>' : "") + "</span>" +
    '<span class="coop-picks">' + (x.picks || []).map(o => { const d = RG_BY_ID.get(o.id); return d ? '<span class="rg-mini">' + rgDexSprite(d, o.shiny) + "</span>" : ""; }).join("") + "</span>" +
    '<span class="note">' + (x.here === false ? "Disconnected" : x.lobbyReady ? "✓ Ready" : "Picking starters") + "</span></li>" : '<li class="waiting"><span class="who note"><span class="co-num">' + (i + 1) + "</span>Waiting for a player…</span></li>").join("") + "</ul>";
  const allIn = Coop.players.length === Coop.size && Coop.players.every(x => x.lobbyReady);
  app.innerHTML = head + (Coop.error ? '<p class="err">' + esc(Coop.error) + "</p>" : "") +
    '<div class="rg-startgrid"><section class="panel"><div class="headrow"><h3>Choose your starters</h3><span class="note">Up to ' + cap + " · your own budget and unlocks</span></div>" +
      '<div class="rg-filters"><input type="search" id="rg-q" placeholder="Search Pokémon" value="' + esc(p.q || "") + '" aria-label="Search starters" autocomplete="off">' +
        '<select id="rg-type" aria-label="Filter by type"><option value="">All types</option>' + RG_TYPES.map(t => '<option value="' + t + '"' + (p.type === t ? " selected" : "") + ">" + pretty(t) + "</option>").join("") + "</select>" +
        '<select id="rg-sort" aria-label="Sort"><option value="dex"' + (p.sort === "dex" ? " selected" : "") + '>Starters first</option><option value="cost"' + (p.sort === "cost" ? " selected" : "") + '>Cost</option><option value="name"' + (p.sort === "name" ? " selected" : "") + ">Name</option></select></div>" +
      '<div class="rg-roster" id="rg-grid">' + rgRosterGrid() + "</div></section>" +
    '<aside class="panel rg-setup"><div class="codebox"><div><span class="label">Room code</span><div class="code mono" id="code">' + (Coop.code ? esc(Coop.code) : '<span class="spin" aria-hidden="true"></span>') + '</div><span class="note">' + esc(Coop.size + " players · " + (Coop.mode === "endless" ? "Endless" : "Classic") + " · " + RG_CHALLENGE[Coop.challenge][0]) + "</span></div>" + (host && Coop.code ? '<button class="btn sm" data-act="copy-coop" type="button">Copy code</button>' : "") + "</div>" +
      (host && Coop.serverLost ? '<p class="note coop-warn"><span class="spin" aria-hidden="true"></span> Lost touch with the room server. Reconnecting so friends can still join…</p>' : "") +
      (host && Coop.code && Coop.players.length < Coop.size ? '<p class="note" style="margin:0">Friends join from <b>Co-op Roguelike → Join a friend</b> on the start screen with this code. Keep this screen open while they join.</p>' : "") +
      players +
      '<h3 style="margin:8px 0 0">Your starters</h3><div class="rg-budget"><span class="label">Budget</span><span class="rg-bbar"><i style="width:' + Math.min(100, Math.round(used / budget * 100)) + '%"></i></span><b class="mono">' + used + " / " + budget + "</b></div>" +
      '<div id="rg-teambox">' + rgTeamBox() + "</div>" +
      '<div class="row"><button class="btn ' + (Coop.lobbyReady ? "" : "primary") + '" type="button" data-cact="lready"' + (p.team.length ? "" : " disabled") + ">" + (Coop.lobbyReady ? "Not ready, keep picking" : p.team.length ? "I’m ready" : "Pick at least one starter") + "</button>" +
      (host ? '<button class="btn primary" type="button" data-cact="start"' + (allIn ? "" : " disabled") + ">Start the run →</button>" : "") + '<button class="btn ghost" type="button" data-cact="leave">Leave</button></div>' +
      (host && !allIn ? '<p class="note" style="margin:0">Starts when all ' + Coop.size + " players have joined and are ready.</p>" : !host ? '<p class="note" style="margin:0">The host starts the run when everyone is ready.</p>' : "") +
    "</aside></div>";
}
function coopIsReady(x) { return x.ready != null ? !!x.ready : !!(x.waveReady && x.waveReady.wave === Coop.wave); }
function coopReadyPanel(run) {
  const list = Array.from({ length: run.coop.size }, (_, i) => Coop.players.find(x => x.idx === i) || { idx: i, name: (run.coop.players[i] || {}).name || "Player " + (i + 1), here: false, party: [] });
  const meReady = !!Coop.myReady;
  const waitingFor = list.filter(x => x.here !== false && !coopIsReady(x) && x.idx !== Coop.me).map(x => x.name);
  return '<div id="coop-ready" class="coop-ready"><ul class="coop-team">' + list.map(x => '<li class="' + (coopIsReady(x) || (x.idx === Coop.me && meReady) ? "ready" : "") + (x.here === false ? " gone" : "") + '"><span class="who"><span class="co-num">' + (x.idx + 1) + "</span><b>" + esc(x.idx === Coop.me ? "You" : x.name) + '</b></span><span class="coop-picks">' + (x.idx === Coop.me ? coopPartySummary(run) : (x.party || [])).map(coopMini).join("") + '</span><span class="note">' + (x.here === false ? "Away · AI plays their last team" : coopIsReady(x) || (x.idx === Coop.me && meReady) ? "✓ Ready" : "Getting ready") + "</span></li>").join("") + "</ul>" +
    '<div class="row rg-goRow"><button class="btn ' + (meReady ? "" : "primary") + ' rg-go" type="button" data-ract="fight"' + (run.prompts.length || !Coop.on ? " disabled" : "") + ">" + (meReady ? "Not ready yet" : "Ready for wave " + run.wave) + ' <span class="kbd">F</span></button>' +
    (!Coop.on ? '<span class="err">Not connected. Rejoin your room from the Co-op screen.</span>' : meReady ? '<span class="note"><span class="spin" aria-hidden="true"></span> ' + (waitingFor.length ? "Waiting for " + esc(waitingFor.join(", ")) + "…" : "Starting…") + "</span>" : !rgAlive(run).length ? '<span class="note">All your Pokémon have fainted. You can still ready up and cheer your team on, or heal first.</span>' : "") + "</div></div>";
}

/* ---------- input ---------- */
document.addEventListener("change", e => {
  const t = e.target;
  if (t && t.dataset && t.dataset.cset) { Coop.setup[t.dataset.cset] = t.dataset.cset === "size" ? +t.value : t.value; if (state.screen === "coop") render(); }
});
document.addEventListener("click", async e => {
  const t = e.target.closest && e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.cact) {
    const nameEl = document.getElementById("pname");
    if (nameEl) { playerName = cleanName(nameEl.value); try { localStorage.setItem("rd-name", playerName); } catch (err) { } }
    if (d.cact === "host") return coopHost(false);
    if (d.cact === "reopen") return coopHost(true);
    if (d.cact === "join") return coopJoin();
    if (d.cact === "retry") return coopJoin(Coop.lastCode);
    if (d.cact === "leave") { coopLeave(false); state.screen = "coop"; return render(); }
    if (d.cact === "lready") { if (!rgPickState().team.length) return; Coop.lobbyReady = !Coop.lobbyReady; coopSendPicks(); return render(); }
    if (d.cact === "start") return coopHostStartRun();
    return;
  }
  if (state.screen === "coop" && Coop.on && (d.ropt || d.rdrop || d.rshinytog || d.rmegatog)) { Coop.lobbyReady = false; coopSendPicks(); return render(); }
  if (d.act === "copy-coop") { const code = Coop.code; if (navigator.clipboard) navigator.clipboard.writeText(code).then(() => toast("Code copied"), () => toast("Code: " + code)); else toast("Code: " + code); return; }
  if (!(battle.rogue && battle.rogue.coop) || state.screen !== "battle") return;
  if (d.cmv != null) {
    const v = currentView(); if (!v || battle.playing) return;
    const me = v.you.team[v.you.actives[Coop.me]], i = +d.cmv, sel = battle.csel || {};
    if (i >= 0) {
      const m = shownMove(me, me.moves[i], sel.tera);
      const opts = coopTargets(v, me, m, "move");
      const foes = opts.filter(o => o.side === "foe");
      if (opts.length > 1) { sel.pending = i; battle.csel = sel; return renderControls(v, false); }
      const o = opts[0];
      return coopChoose({ type: "move", index: i, tera: !!sel.tera, target: o ? (o.side === "foe" ? { side: "foe", pos: o.pos } : o.side === "ally" ? { side: "ally", pos: o.pos } : null) : (foes[0] ? { side: "foe", pos: foes[0].pos } : null) });
    }
    return coopChoose({ type: "move", index: i, tera: false, target: null });
  }
  if (d.ctg != null) {
    const sel = battle.csel; if (!sel) return;
    const [side, p] = String(d.ctg).split(":");
    const target = side === "foe" ? { side: "foe", pos: +p } : side === "ally" ? { side: "ally", pos: +p } : null;
    if (sel.ball) return coopChoose({ type: "ball", ball: sel.ball, target });
    return coopChoose({ type: "move", index: sel.pending, tera: !!sel.tera, target });
  }
  if (d.csw != null) return coopChoose({ type: "switch", index: +d.csw });
  if (d.act === "c-aifill") return coopAiFill();
  if (d.act === "c-tera") { const sel = battle.csel; if (sel) sel.tera = !sel.tera; return renderControls(currentView(), false); }
  if (d.act === "c-back") { const sel = battle.csel; if (sel) { sel.pending = null; sel.ball = null; } return renderControls(currentView(), false); }
  if (d.act === "c-flee") { Coop.fleeOn = !Coop.fleeOn; if (Coop.role === "host") coopHostFlee(Coop.me, Coop.fleeOn); else coopSend({ t: "flee", on: Coop.fleeOn }); return renderControls(currentView(), false); }
  if (d.cemote != null) { const i = +d.cemote; const now = Date.now(); if (battle.lastEmote && now - battle.lastEmote < 1200) return; battle.lastEmote = now; if (Coop.role === "host") { coopBroadcast({ t: "emote", from: 0, e: i }); coopShowEmote(0, i); } else coopSend({ t: "emote", e: i }); return; }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target && e.target.id === "coopcode") coopJoin(); });
window.addEventListener("beforeunload", () => { if (Coop.on && Rogue.run && Rogue.run.coop) rgSave(); });

render();
</script>
</body>
</html>
